name: e2e (bsdkrun ci / KVM)

# Runs the two bun CI examples end to end under KVM: `bsdkrun ci run` boots a
# microVM per workflow, clones the example's HEAD into it and runs `bun test`.
# Between them the two examples cover both image strategies:
#
#   - ci-bun-ubuntu  — `image: ubuntu:24.04`: a plain OCI image, the runner
#     installs git via apt, the workflow installs bun itself.
#   - ci-bun-nixery  — `dependencies: [bun]`: the toolchain arrives in a
#     nixery.dev image; if nixery times out building it, the run falls back to
#     the pinned nixos/nix image + `nix profile add`, which this then covers
#     instead. Either path must end in the same passing tests.
#
# It then runs the seven foreign-platform examples (github, gitlab,
# woodpecker, drone, circleci, buildkite, semaphore, travis) — each config
# auto-detected
# and translated into a microVM run.
#
# Following the e2e conventions: the job asserts on the output the guest
# actually produced (`3 pass` from bun) — a step's conclusion alone proves
# nothing. Both example steps ran strict from their first green run
# (2026-08-18): x86_64/KVM passed on the first attempt, so a failure here is a
# regression, not an unestablished target.
#
# x86_64 only: GitHub's arm64 runners do not expose /dev/kvm.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
    paths:
      - "ci/**"
      - "core/**"
      - "agent/**"
      - "examples/ci-*/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

jobs:
  ci-examples:
    name: x86_64
    runs-on: ubuntu-latest # x86_64; has /dev/kvm
    timeout-minutes: 90 # the heavy detection set installs real dependency trees
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      - name: Install build deps (incl. libkrun/libkrunfw build requirements)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils python3 \
            python3-pyelftools pkg-config patchelf patch cpio kmod rsync zstd \
            flex bison bc libelf-dev libssl-dev \
            clang libclang-dev llvm-dev musl-tools libseccomp-dev

      # The guests download packages (apt, bun.sh, cache.nixos.org), so they
      # need the user-mode network.
      - name: Install gvproxy (user-mode networking)
        run: |
          set -eux
          sudo curl -fL -o /usr/local/bin/gvproxy \
            https://github.com/containers/gvisor-tap-vsock/releases/latest/download/gvproxy-linux-amd64
          sudo chmod +x /usr/local/bin/gvproxy

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      # `bsdkrun ci` is a Go binary embedded by core/build.rs — without Go on
      # PATH the build merely warns and the binary under test has no ci at all.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ci/go.mod

      # Same cache the other KVM workflows use; the kernel compile is ~15-20
      # min on a miss. Restore/save split so a failed build never poisons it.
      - name: Restore libkrun build
        id: libkrun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v16

      - name: Build libkrun (cache miss)
        if: steps.libkrun-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 -b v5.5.0 https://github.com/containers/libkrunfw
          ( cd libkrunfw && make -j"$(nproc)" && sudo make install )
          git clone --depth 1 -b feat/pvh-boot https://github.com/tsirysndr/libkrun
          ( cd libkrun && make -j"$(nproc)" BLK=1 NET=1 )

      - name: Save libkrun build
        if: steps.libkrun-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v16

      - name: Install libkrun
        run: |
          set -eux
          ( cd libkrunfw && sudo make install )
          ( cd libkrun && sudo make install BLK=1 NET=1 )
          echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/libkrun.conf
          sudo ldconfig

      - name: Build bsdkrun
        run: |
          set -eux
          cargo build --release
          # The embedded ci runner must actually be in there — a Go toolchain
          # hiccup degrades the build to a warning, and every step below would
          # then test nothing.
          ./target/release/bsdkrun ci --help 2>&1 | grep -qi "workflow"

      - name: Build guest agent (static musl)
        run: |
          set -eux
          ( cd agent && cargo build --release --target x86_64-unknown-linux-musl )
          echo "BSDKRUN_AGENT_LINUX=$PWD/agent/target/x86_64-unknown-linux-musl/release/bsdkrun-agent" >> "$GITHUB_ENV"

      - name: bsdkrun kvm — host readiness check
        run: |
          set -eux
          ./target/release/bsdkrun kvm --json | grep -q '"ok": true'

      # CI runs the repository's HEAD commit, so each example gets its own
      # little git repo first — same procedure its README documents.
      - name: e2e — ci-bun-ubuntu (image ubuntu:24.04, no nixery)
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r examples/ci-bun-ubuntu/. "$d"
          git -C "$d" init -q
          git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init

          set +e
          timeout 1500 ./target/release/bsdkrun ci run -w "$d" test 2>&1 | tee /tmp/ci-ubuntu.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc"
          # The output the guest actually produced, not the conclusion: all
          # three bun tests passed and the workflow closed green.
          grep -q "3 pass" /tmp/ci-ubuntu.log
          grep -q "test.yml passed" /tmp/ci-ubuntu.log
          test "$rc" -eq 0

      - name: e2e — ci-bun-nixery (dependencies via nixery, or the nix fallback)
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r examples/ci-bun-nixery/. "$d"
          git -C "$d" init -q
          git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init

          set +e
          timeout 2400 ./target/release/bsdkrun ci run -w "$d" test 2>&1 | tee /tmp/ci-nixery.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit=$rc"
          if grep -q "falling back" /tmp/ci-nixery.log; then
            echo "NOTE: nixery timed out — this run exercised the nixos/nix fallback path"
          fi
          grep -q "3 pass" /tmp/ci-nixery.log
          grep -q "test.yml passed" /tmp/ci-nixery.log
          test "$rc" -eq 0

      # The seven platform examples: each asserts its identity env, the
      # clone, and prints <platform>-example-ok — grepped here, because a
      # step's conclusion proves nothing. All failures are collected before
      # judging so one broken platform does not hide the others.
      # Strict since its first green run (2026-08-18): all seven passed on
      # x86_64/KVM on the first attempt, so a failure here is a regression.
      - name: e2e — foreign platforms (all twelve platforms)
        run: |
          set -eux
          failed=""
          for p in github gitlab woodpecker drone circleci buildkite semaphore jenkins azure codebuild tekton travis; do
            d=$(mktemp -d)
            cp -r "examples/ci-$p/." "$d"
            git -C "$d" init -q
            git -C "$d" add -A
            git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
            set +e
            timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee "/tmp/ci-$p.log"
            rc=${PIPESTATUS[0]}
            set -e
            if ! grep -q "$p-example-ok" "/tmp/ci-$p.log" || [ "$rc" -ne 0 ]; then
              failed="$failed $p"
            fi
          done
          test -z "$failed" || { echo "FAILED:$failed"; exit 1; }

      # The real actions runner: this example executes the actual
      # oven-sh/setup-bun@v2 JavaScript action under the Actions protocol,
      # and the following run: step's `bun --version` only works if the
      # action's GITHUB_PATH write survived into the next step.
      - name: e2e — real GitHub Actions (setup-bun executes for real)
        # strict since the first green x86_64 run (32260226204)
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-github-actions/." "$d"
          git -C "$d" init -q
          git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" \
            --secret GITHUB_TOKEN="${GITHUB_TOKEN}" 2>&1 | tee /tmp/ci-gha.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "Provision actions runtime (node)" /tmp/ci-gha.log
          grep -q "github-actions-example-ok" /tmp/ci-gha.log
          test "$rc" -eq 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Real Buildkite plugins: metahook cloned at its tag, configured via
      # BUILDKITE_PLUGIN_* env, its environment hook sourced — the command
      # asserts the hook's export actually arrived.
      - name: e2e — real Buildkite plugins (metahook executes)
        # strict since the first green x86_64 run (32260226204)
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-buildkite-plugins/." "$d"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee /tmp/ci-bkp.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "buildkite-plugins-example-ok" /tmp/ci-bkp.log
          test "$rc" -eq 0

      # Real Jenkins: a scripted pipeline assembled and executed under
      # Jenkinsfile Runner — an actual headless Jenkins — in the guest.
      - name: e2e — real Jenkins (scripted pipeline under Jenkinsfile Runner)
        # strict since the first green x86_64 run (32260226204)
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-jenkins-real/." "$d"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 1800 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tail -60 | tee /tmp/ci-jfr.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "jenkins-real-example-ok" /tmp/ci-jfr.log
          test "$rc" -eq 0

      # Real Drone plugins, daemon-less: plugins/download's rootfs pulled
      # host-side, chroot-executed with PLUGIN_* env; the next step asserts
      # the fetched file arrived in the shared workspace.
      - name: e2e — real Drone plugins (plugins/download executes)
        continue-on-error: true # flip to false after the first green run on x86_64
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-drone-plugins/." "$d"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee /tmp/ci-dp.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "drone-plugins-example-ok" /tmp/ci-dp.log
          test "$rc" -eq 0

      - name: e2e — real Woodpecker plugins (same protocol, CI_* identity)
        continue-on-error: true # flip to false after the first green run on x86_64
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-woodpecker-plugins/." "$d"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee /tmp/ci-wp.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "woodpecker-plugins-example-ok" /tmp/ci-wp.log
          test "$rc" -eq 0

      # Real CircleCI orb, fetched from the registry at plan time and
      # expanded: shellcheck/check's parameterized executor becomes the VM
      # image, and the done job proves ordering across the orb job.
      - name: e2e — CircleCI orbs (circleci/shellcheck expands and runs)
        continue-on-error: true # flip to false after the first green run on x86_64
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-circleci-orbs/." "$d"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee /tmp/ci-orbs.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "circleci-orbs-example-ok" /tmp/ci-orbs.log
          test "$rc" -eq 0

      # Tekton: a taskRef the checkout does not carry, resolved from the
      # tektoncd catalog, plus a step whose image differs from the VM's and
      # therefore runs chrooted into its own rootfs.
      - name: e2e — Tekton catalog tasks and per-step images
        continue-on-error: true # flip to false after the first green run on x86_64
        run: |
          set -eux
          d=$(mktemp -d)
          cp -r "examples/ci-tekton-catalog/." "$d"
          git -C "$d" init -q && git -C "$d" add -A
          git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee /tmp/ci-tkc.log
          rc=${PIPESTATUS[0]}
          set -e
          # The catalog task really ran: its curl step printed the task
          # YAML it fetched. And the per-step-image step served the marker
          # from an image other than the one the VM booted.
          grep -q "This task performs curl operation" /tmp/ci-tkc.log
          grep -q "tekton-catalog-example-ok" /tmp/ci-tkc.log
          ! grep -q "unresolved, skipped" /tmp/ci-tkc.log
          test "$rc" -eq 0

      # No CI config at all: the runner must detect the project (a bare Go
      # module here) and generate + run a workflow for it. Asserts the
      # detection announcement and the test-before-build execution.
      - name: e2e — project detection (no CI config)
        run: |
          set -eux
          d=$(mktemp -d)
          cd "$d"
          printf 'module example.com/hello\n\ngo 1.22\n' > go.mod
          printf 'package main\nfunc Add(a, b int) int { return a + b }\nfunc main() {}\n' > main.go
          printf 'package main\nimport "testing"\nfunc TestAdd(t *testing.T) { if Add(1,2) != 3 { t.Fatal() } }\n' > main_test.go
          git init -q && git add -A && git -c user.email=ci@e2e -c user.name=e2e commit -qm init
          cd -
          set +e
          timeout 900 ./target/release/bsdkrun ci run --plain --dry-run \
            --secret RAILWAY_TOKEN=e2e-dummy-token -w "$d" 2>&1 | tee /tmp/ci-detect.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q "detected go project (go.mod)" /tmp/ci-detect.log
          grep -q "ok  " /tmp/ci-detect.log
          # Deploy detection keyed on the secret name, dry-run announcing
          # the command instead of running it — and the token value masked.
          grep -q "deploy: railway (RAILWAY_TOKEN detected) \[dry-run\]" /tmp/ci-detect.log
          grep -q "\[dry-run\] would deploy to railway" /tmp/ci-detect.log
          ! grep -q "e2e-dummy-token" /tmp/ci-detect.log
          grep -q "build passed" /tmp/ci-detect.log
          test "$rc" -eq 0

      # The unikraft examples carry no CI config, so running `bsdkrun ci`
      # against them exercises the whole detection path: project inferred,
      # workflow generated, tests (added to the examples for exactly this)
      # run before builds. The fast set is strict; the heavy set (big images,
      # real dependency installs and compiles) establishes itself first.
      - name: e2e — detection over unikraft examples (fast set)
        run: |
          set -eux
          failed=""
          for x in unikraft-go unikraft-bun unikraft-deno unikraft-expressjs; do
            d=$(mktemp -d)
            cp -r "examples/$x/." "$d"
            git -C "$d" init -q
            git -C "$d" add -A
            git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
            set +e
            timeout 900 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tee "/tmp/det-$x.log"
            rc=${PIPESTATUS[0]}
            set -e
            if ! grep -q "detected .* project" "/tmp/det-$x.log" || [ "$rc" -ne 0 ]; then
              failed="$failed $x"
            fi
          done
          test -z "$failed" || { echo "FAILED:$failed"; exit 1; }

      # Strict since its first green run (2026-08-19): every heavy example
      # passed on x86_64/KVM, so a failure here is a regression — or a
      # registry outage, which the step's own log names explicitly.
      - name: e2e — detection over unikraft examples (heavy set)
        run: |
          set -eux
          failed=""
          for x in unikraft-crystal unikraft-elixir unikraft-gleam unikraft-ruby unikraft-laravel unikraft-symfony unikraft-actix unikraft-clojure unikraft-dotnet unikraft-haskell; do
            d=$(mktemp -d)
            cp -r "examples/$x/." "$d"
            git -C "$d" init -q
            git -C "$d" add -A
            git -C "$d" -c user.email=ci@e2e -c user.name=e2e commit -qm init
            set +e
            timeout 1800 ./target/release/bsdkrun ci run --plain -w "$d" 2>&1 | tail -40 | tee "/tmp/det-$x.log"
            rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" -eq 0 ] || failed="$failed $x"
          done
          test -z "$failed" || { echo "FAILED:$failed"; exit 1; }

      # A cancelled/timed-out run can leave a VM behind; say what the host
      # state was either way so a red run is diagnosable from the log alone.
      - name: Host state after the runs
        if: always()
        run: |
          ./target/release/bsdkrun ps || true
          ./target/release/bsdkrun ps 2>/dev/null | awk 'NR>1 {print $1}' \
            | xargs -r -n1 ./target/release/bsdkrun rm -f || true

  # The spindle-compatible server, exercised on Linux without building the
  # whole CLI: `ci` is a plain Go binary, and the surface under test is HTTP,
  # not VMs. This is the job that would catch a route disappearing, auth
  # loosening, or the spindle build tag breaking.
  spindle-api:
    name: spindle API (drop-in surface)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ci/go.mod

      - name: Unit tests (spindle build)
        run: go -C ci test -tags spindle ./...

      # Both build variants must keep compiling: the default one is what ships
      # in a portable binary, the tagged one is what a self-hoster runs.
      - name: Build both variants
        run: |
          set -eux
          go -C ci build ./...
          go -C ci build -tags spindle -o /tmp/bsdkrun-ci .

      - name: Serve and answer like a spindle
        run: |
          set -eux
          export SPINDLE_SERVER_HOSTNAME=localhost:6555
          export SPINDLE_SERVER_OWNER=did:plc:e2eowner
          export SPINDLE_SERVER_DB_PATH=/tmp/spindle.db
          export SPINDLE_SERVER_LOG_DIR=/tmp/spindle-logs
          export SPINDLE_SERVER_REPO_DIR=/tmp/spindle-repos
          export SPINDLE_SERVER_LISTEN_ADDR=127.0.0.1:6555
          /tmp/bsdkrun-ci serve > /tmp/spindle-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6555/xrpc/sh.tangled.owner >/dev/null && break
            sleep 1
          done
          cat /tmp/spindle-serve.log

          # The appview verifies a spindle with exactly this call.
          curl -sf http://127.0.0.1:6555/xrpc/sh.tangled.owner | tee /tmp/owner.json
          grep -q '"owner":"did:plc:e2eowner"' /tmp/owner.json

          # Public reads answer; a missing parameter is a 400, not a 500.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:6555/xrpc/sh.tangled.ci.queryPipelines?repo=did:plc:x')" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:6555/xrpc/sh.tangled.ci.queryPipelines')" = 400

          # Anything that can start work or touch secrets refuses an
          # unauthenticated caller.
          for ep in ci.triggerPipeline ci.cancelPipeline repo.addSecret repo.removeSecret; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "http://127.0.0.1:6555/xrpc/sh.tangled.$ep")
            test "$code" = 403 || { echo "$ep answered $code, expected 403"; exit 1; }
          done

          # The database it created is spindle's own schema.
          sudo apt-get install -y --no-install-recommends sqlite3 >/dev/null
          sqlite3 /tmp/spindle.db '.tables' | tee /tmp/tables.txt
          for t in acl events pipelines workflows secrets repos spindle_members; do
            grep -qw "$t" /tmp/tables.txt || { echo "missing table $t"; exit 1; }
          done
