name: e2e (daemon / gRPC)

# The daemon links the bsdkrun engine but not its `boot` half, so it still needs
# neither /dev/kvm nor libkrun and still runs on ordinary runners. What it reads
# — machines, images, volumes, networks — it reads in-process, so the tests seed
# a real database under a temp BSDKRUN_STATE; what it cannot do in-process it
# hands to `bsdkrun-supervisor`, which a stub stands in for so the suite can
# assert the command it was given without booting anything.
#
# Both hosts are covered because the interactive path differs between them:
# remote shells run under a pty, and pty behaviour is where macOS and Linux
# diverge most.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "daemon/**"
      - "core/**"
      - "supervisor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e-daemon.yml"
  push:
    branches:
      - "main"
    paths:
      - "daemon/**"
      - "core/**"
      - "supervisor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e-daemon.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # tonic-prost-build shells out to protoc to compile the .proto.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - run: protoc --version

      - name: Formatting
        run: cargo fmt --check

      # `-p`, not `--workspace`: cargo unifies features across one build, so
      # pulling the CLI or the supervisor in would compile bsdkrun-core with
      # `boot` on and demand libkrun on a runner that has none.
      - name: Clippy
        run: cargo clippy -p bsdkrun-daemon --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test -p bsdkrun-daemon --lib

      - name: End-to-end tests (gRPC)
        run: cargo test -p bsdkrun-daemon --test e2e

      - name: End-to-end tests (GraphQL)
        run: cargo test -p bsdkrun-daemon --test graphql

  # Exercises the actual shipped binary over the wire with a third-party client,
  # which is the only way to prove the parts no Rust test touches: that
  # reflection really is reachable *without* a token, and that the token gate
  # really does stand in front of everything else.
  wire:
    name: wire protocol (grpcurl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Node 22+ for its global WebSocket, used by the shell subscription test.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc and grpcurl
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          GRPCURL_VERSION=1.9.1
          curl -fsSL -o /tmp/grpcurl.tar.gz \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          tar -xzf /tmp/grpcurl.tar.gz -C /tmp grpcurl
          sudo install -m 0755 /tmp/grpcurl /usr/local/bin/grpcurl
          grpcurl --version

      - name: Build the daemon
        run: cargo build --release -p bsdkrun-daemon

      - name: Start the daemon
        run: |
          set -eux
          # A stub stands in for bsdkrun-supervisor: this job is about the wire
          # protocol, not about booting VMs, and the supervisor is the only half
          # that needs a hypervisor.
          cat > /tmp/bsdkrun-supervisor <<'EOF'
          #!/bin/sh
          case "$2" in
            *'"Probe"'*) echo "probe ok"; exit 0 ;;
            # Backs the interactive-shell test: echo a marker, then read stdin
            # so keystrokes sent over GraphQL have something to reach.
            *'"Exec"'*|*'"Shell"'*) echo "EXEC_OK"; cat; exit 0 ;;
          esac
          if [ "$1" = cli ]; then
            shift; [ "$1" = -- ] && shift
            case "$1" in
              probe) echo "probe ok"; exit 0 ;;
              *) echo "unknown: $1" >&2; exit 2 ;;
            esac
          fi
          echo "unknown: $2" >&2; exit 2
          EOF
          chmod +x /tmp/bsdkrun-supervisor

          # A state directory of its own, so the daemon reads a database this
          # job owns rather than whatever the runner happens to have.
          export BSDKRUN_STATE=/tmp/bsdkrun-state
          mkdir -p "$BSDKRUN_STATE"

          BSDKRUN_TOKEN=ci-secret-token \
            ./target/release/bsdkrund --bind 127.0.0.1:50077 \
            --graphql-bind 127.0.0.1:50078 --supervisor /tmp/bsdkrun-supervisor \
            > /tmp/daemon.log 2>&1 &
          echo $! > /tmp/daemon.pid

          # Wait for the listeners rather than sleeping a fixed amount.
          for port in 50077 50078; do
            for _ in $(seq 1 60); do
              if bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then break; fi
              sleep 0.5
            done
            bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null \
              || { echo "port $port never opened"; cat /tmp/daemon.log; exit 1; }
          done

      - name: Reflection is reachable anonymously
        run: |
          set -eux
          services=$(grpcurl -plaintext 127.0.0.1:50077 list)
          echo "$services"
          echo "$services" | grep -qx "bsdkrun.v1.Bsdkrun"
          echo "$services" | grep -qx "grpc.health.v1.Health"
          # Method-level detail must be discoverable too, not just names.
          grpcurl -plaintext 127.0.0.1:50077 describe bsdkrun.v1.Bsdkrun | grep -q "rpc Exec"

      - name: Health check answers without a token
        run: |
          set -eux
          grpcurl -plaintext -d '{}' 127.0.0.1:50077 grpc.health.v1.Health/Check | grep -q SERVING

      - name: An RPC without a token is rejected
        run: |
          set -eux
          out=$(grpcurl -plaintext -d '{}' 127.0.0.1:50077 bsdkrun.v1.Bsdkrun/Info 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Unauthenticated"

      - name: An RPC with the wrong token is rejected
        run: |
          set -eux
          out=$(grpcurl -plaintext -H 'authorization: Bearer wrong' -d '{}' \
            127.0.0.1:50077 bsdkrun.v1.Bsdkrun/Info 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Unauthenticated"
          echo "$out" | grep -q "invalid token"

      - name: An RPC with the right token succeeds
        run: |
          set -eux
          grpcurl -plaintext -H 'authorization: Bearer ci-secret-token' -d '{}' \
            127.0.0.1:50077 bsdkrun.v1.Bsdkrun/Info | tee /tmp/info.json
          # The engine is linked in, so its version is reported directly rather
          # than read back out of another binary.
          grep -q '"cliVersion"' /tmp/info.json
          grep -q '"daemonVersion"' /tmp/info.json

      - name: The x-bsdkrun-token header works too
        run: |
          set -eux
          grpcurl -plaintext -H 'x-bsdkrun-token: ci-secret-token' -d '{}' \
            127.0.0.1:50077 bsdkrun.v1.Bsdkrun/ListMachines | grep -q "{}"

      # A streaming RPC over the wire: output frames arrive and the stream ends
      # with the command's real exit code rather than hanging.
      - name: Streaming passthrough returns output and an exit code
        run: |
          set -eux
          grpcurl -plaintext -H 'authorization: Bearer ci-secret-token' \
            -d '{"start":{"args":["probe"]}}' \
            127.0.0.1:50077 bsdkrun.v1.Bsdkrun/Run | tee /tmp/run.json
          grep -q '"stdout"' /tmp/run.json
          grep -q '"exitCode": 0' /tmp/run.json

      - name: A failing command propagates its exit code
        run: |
          set -eux
          grpcurl -plaintext -H 'authorization: Bearer ci-secret-token' \
            -d '{"start":{"args":["nope"]}}' \
            127.0.0.1:50077 bsdkrun.v1.Bsdkrun/Run | tee /tmp/fail.json
          grep -q '"exitCode": 2' /tmp/fail.json

      # -- GraphQL ------------------------------------------------------------

      - name: GraphQL rejects a request with no token
        run: |
          set -eux
          code=$(curl -s -o /tmp/anon.json -w '%{http_code}' -X POST \
            http://127.0.0.1:50078/graphql -H 'content-type: application/json' \
            -d '{"query":"{ info { cliVersion } }"}')
          cat /tmp/anon.json
          [ "$code" = "401" ]
          grep -q UNAUTHENTICATED /tmp/anon.json

      - name: GraphQL accepts the bearer token
        run: |
          set -eux
          curl -sf -X POST http://127.0.0.1:50078/graphql \
            -H 'content-type: application/json' \
            -H 'authorization: Bearer ci-secret-token' \
            -d '{"query":"{ info { daemonVersion cliVersion os arch } }"}' | tee /tmp/info.json
          grep -q "9.9.9-stub" /tmp/info.json

      - name: GraphiQL is served anonymously
        run: |
          set -eux
          curl -sf http://127.0.0.1:50078/graphql | grep -qi graphiql

      - name: CORS lets a cross-origin frontend through
        run: |
          set -eux
          curl -s -D- -o /dev/null -X OPTIONS http://127.0.0.1:50078/graphql \
            -H 'origin: http://localhost:5173' \
            -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: authorization' \
            | tee /tmp/cors.txt
          grep -qi 'access-control-allow-origin' /tmp/cors.txt

      # The one path no HTTP client can cover: a subscription over a real
      # WebSocket, carrying an interactive shell. Output arrives on the
      # subscription while input goes back as mutations on the same socket —
      # this proves that split actually works end to end.
      - name: Interactive shell over a GraphQL subscription
        run: |
          set -eux
          cat > /tmp/shell-test.mjs <<'EOF'
          const WS = 'ws://127.0.0.1:50078/graphql/ws';
          const HTTP = 'http://127.0.0.1:50078/graphql';
          const TOKEN = 'ci-secret-token';

          async function gql(query, variables = {}) {
            const r = await fetch(HTTP, {
              method: 'POST',
              headers: { 'content-type': 'application/json', authorization: `Bearer ${TOKEN}` },
              body: JSON.stringify({ query, variables }),
            });
            const j = await r.json();
            if (j.errors) throw new Error(JSON.stringify(j.errors));
            return j.data;
          }

          const ws = new WebSocket(WS, 'graphql-transport-ws');
          const chunks = [];
          const send = (o) => ws.send(JSON.stringify(o));
          const fail = (m) => { console.error('FAIL:', m); process.exit(1); };

          ws.onerror = () => fail('websocket error');
          ws.onopen = () => send({ type: 'connection_init', payload: { authorization: `Bearer ${TOKEN}` } });

          ws.onmessage = async (ev) => {
            const msg = JSON.parse(ev.data);

            if (msg.type === 'connection_ack') {
              console.log('connection_ack: authenticated over the websocket');
              // Open first, subscribe second — the real ordering, and the race
              // the server-side buffer exists to cover.
              const r = await gql(
                'mutation($m:String!){ openShell(machineId:$m, command:["cat"], rows:40, cols:120){ id } }',
                { m: 'abc123' },
              );
              const id = r.openShell.id;
              console.log('openShell ->', id);

              // Deliberately wait, so the stub's output is produced with nobody
              // listening. It must still be replayed to the subscriber.
              await new Promise((r) => setTimeout(r, 750));

              send({
                id: '1',
                type: 'subscribe',
                payload: {
                  query: 'subscription($s:String!){ shellOutput(sessionId:$s){ dataBase64 exitCode } }',
                  variables: { s: id },
                },
              });

              await gql('mutation($s:String!,$d:String!){ sendShellInput(sessionId:$s, dataBase64:$d) }', {
                s: id,
                d: Buffer.from('hello-from-graphql\n\x04').toString('base64'),
              });
              await gql('mutation($s:String!){ resizeShell(sessionId:$s, rows:50, cols:100) }', { s: id });
              console.log('sent input + resize');
              return;
            }

            if (msg.type === 'next') {
              const p = msg.payload.data.shellOutput;
              if (p.dataBase64) chunks.push(Buffer.from(p.dataBase64, 'base64'));
              if (p.exitCode !== null && p.exitCode !== undefined) {
                const text = Buffer.concat(chunks).toString('utf8');
                console.log('--- output ---\n' + text + '\n--- end --- exit=' + p.exitCode);
                if (!text.includes('EXEC_OK')) fail('output buffered before subscribing was lost');
                if (!text.includes('hello-from-graphql')) fail('keystrokes never reached the command');
                console.log('PASS');
                process.exit(0);
              }
              return;
            }

            if (msg.type === 'error') fail(JSON.stringify(msg.payload));
          };

          setTimeout(() => fail('timed out'), 45000);
          EOF
          node /tmp/shell-test.mjs

      - name: A subscription without a token is refused
        run: |
          set -eux
          cat > /tmp/ws-auth.mjs <<'EOF'
          const ws = new WebSocket('ws://127.0.0.1:50078/graphql/ws', 'graphql-transport-ws');
          // No token in connection_init: the socket must not be acknowledged.
          ws.onopen = () => ws.send(JSON.stringify({ type: 'connection_init', payload: {} }));
          ws.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'connection_ack') { console.error('FAIL: acked without a token'); process.exit(1); }
          };
          ws.onclose = () => { console.log('PASS: closed without acking'); process.exit(0); };
          setTimeout(() => { console.error('FAIL: timed out'); process.exit(1); }, 20000);
          EOF
          node /tmp/ws-auth.mjs

      - name: Stop the daemon
        if: always()
        run: |
          [ -f /tmp/daemon.pid ] && kill "$(cat /tmp/daemon.pid)" 2>/dev/null || true
          echo "--- daemon log ---"
          cat /tmp/daemon.log || true
