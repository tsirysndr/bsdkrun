name: e2e (Linux / KVM)

# Boots a real OCI microVM under KVM to validate the Linux host port. Only
# GitHub's x86_64 runners expose /dev/kvm (the arm64 runners don't), so CI runs
# amd64 here; arm64-on-Linux must be validated on a KVM-capable host.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "feat/linux-host"
      - "main"
    paths:
      - "src/**"
      - "agent/**"
      - "build.rs"
      - ".github/workflows/e2e-linux.yml"

permissions:
  contents: read

jobs:
  boot:
    name: x86_64
    runs-on: ubuntu-latest # x86_64; has /dev/kvm
    steps:
      - uses: actions/checkout@v4

      - name: Check KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm || true

      - name: Install build deps (incl. libkrun/libkrunfw build requirements)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils python3 \
            pkg-config patchelf flex bison bc libelf-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      # libkrun links libkrunfw (the bundled kernel). Building libkrunfw compiles
      # a Linux kernel from source — slow, but the reliable way to get libkrun on
      # Ubuntu (no distro package). Use `cd`, NOT `make -C`: `-C` implies `-w`,
      # which leaves a stray `w` in MAKEFLAGS that libkrunfw passes to the kernel
      # sub-make as a bogus target ("No rule to make target 'w'").
      - name: Build + install libkrun
        run: |
          set -eux
          git clone --depth 1 https://github.com/containers/libkrunfw
          ( cd libkrunfw && make -j"$(nproc)" && sudo make install )
          git clone --depth 1 https://github.com/containers/libkrun
          ( cd libkrun && make -j"$(nproc)" && sudo make install )
          sudo ldconfig

      - name: Build bsdkrun
        run: cargo build --release

      - name: Build guest agent (static musl)
        run: |
          set -eux
          ( cd agent && cargo build --release --target x86_64-unknown-linux-musl )
          echo "BSDKRUN_AGENT_LINUX=$PWD/agent/target/x86_64-unknown-linux-musl/release/bsdkrun-agent" >> "$GITHUB_ENV"

      - name: e2e — boot an OCI microVM and run a command
        run: |
          set -eux
          out=$(./target/release/bsdkrun --log-level 1 linux alpine -- echo hello-from-kvm)
          echo "----- guest output -----"; echo "$out"
          echo "$out" | grep -q hello-from-kvm

      - name: e2e — detached machine + exec + volume persistence
        run: |
          set -eux
          id=$(./target/release/bsdkrun linux -d -v ci alpine -- sleep 120)
          sleep 6
          ./target/release/bsdkrun exec "$id" uname -a
          ./target/release/bsdkrun exec "$id" /bin/sh -c 'echo persisted > /root/x'
          ./target/release/bsdkrun stop "$id"
          # reboot the volume, confirm persistence
          id2=$(./target/release/bsdkrun linux -d -v ci alpine -- sleep 60)
          sleep 6
          ./target/release/bsdkrun exec "$id2" cat /root/x | grep -q persisted
          ./target/release/bsdkrun volume ls
          ./target/release/bsdkrun stop "$id2"
