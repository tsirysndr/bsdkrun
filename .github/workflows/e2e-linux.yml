name: e2e (Linux / KVM)

# Boots a real OCI microVM under KVM to validate the Linux host port. Only
# GitHub's x86_64 runners expose /dev/kvm (the arm64 runners don't), so CI runs
# amd64 here; arm64-on-Linux must be validated on a KVM-capable host.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "feat/linux-host"
      - "main"
    paths:
      - "src/**"
      - "agent/**"
      - "build.rs"
      - ".github/workflows/e2e-linux.yml"

permissions:
  contents: read

jobs:
  boot:
    name: x86_64
    runs-on: ubuntu-latest # x86_64; has /dev/kvm
    timeout-minutes: 30 # never hang the runner if a guest doesn't power off
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          # Give the runner user access to /dev/kvm (default is root:kvm 0660).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      # PVH boots the guest with paging OFF. On Intel *without* VMX unrestricted
      # guest (common on nested KVM), the host can't virtualize CR0.PG=0 and the
      # guest triple-faults — which is what NetBSD MICROVM is hitting. Log it.
      - name: KVM virtualization capabilities
        run: |
          set -eux
          grep -m1 "model name" /proc/cpuinfo
          grep -qm1 hypervisor /proc/cpuinfo && echo "nested (runs under a hypervisor)" || echo "bare metal"
          grep -ochm1 -e vmx -e svm /proc/cpuinfo || true
          echo -n "kvm_intel unrestricted_guest: "; cat /sys/module/kvm_intel/parameters/unrestricted_guest 2>/dev/null || echo "(kvm_intel not loaded)"
          echo -n "kvm_intel nested: "; cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || echo n/a
          echo -n "kvm_amd nested: ";   cat /sys/module/kvm_amd/parameters/nested   2>/dev/null || echo n/a

      - name: Install build deps (incl. libkrun/libkrunfw build requirements)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils python3 \
            python3-pyelftools pkg-config patchelf patch cpio kmod rsync zstd \
            flex bison bc libelf-dev libssl-dev \
            clang libclang-dev llvm-dev musl-tools

      - name: Install gvproxy (user-mode networking)
        run: |
          set -eux
          sudo curl -fL -o /usr/local/bin/gvproxy \
            https://github.com/containers/gvisor-tap-vsock/releases/latest/download/gvproxy-linux-amd64
          sudo chmod +x /usr/local/bin/gvproxy
          gvproxy --help >/dev/null 2>&1 || which gvproxy

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      # libkrun links libkrunfw (the bundled kernel). Building libkrunfw compiles
      # a Linux kernel from source (~15-20 min), so cache the built trees and skip
      # straight to install on a hit. Bump CACHE_KEY below to force a rebuild.
      # Restore the built libkrunfw/libkrun trees if we've cached them (the kernel
      # compile is ~15-20 min). We restore/save separately so a *failed* build
      # never poisons the cache. Bump the key to force a rebuild.
      - name: Restore libkrun build
        id: libkrun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v13

      # Build only on a cache miss. libkrun links libkrunfw, so libkrunfw must be
      # installed before libkrun builds. Use `cd`, NOT `make -C`: `-C` implies
      # `-w`, which leaves a stray `w` in MAKEFLAGS that libkrunfw passes to the
      # kernel sub-make as a bogus target ("No rule to make target 'w'").
      - name: Build libkrun (cache miss)
        if: steps.libkrun-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 -b v5.5.0 https://github.com/containers/libkrunfw
          ( cd libkrunfw && make -j"$(nproc)" && sudo make install )
          git clone --depth 1 -b feat/pvh-boot https://github.com/tsirysndr/libkrun  # PVH boot for NetBSD amd64
          ( cd libkrun && make -j"$(nproc)" BLK=1 NET=1 )

      # Only cache a build that actually succeeded.
      - name: Save libkrun build
        if: steps.libkrun-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v13

      # Install (fast) on every run — a cache hit restores the built trees but not
      # the system-installed libraries.
      - name: Install libkrun
        run: |
          set -eux
          ( cd libkrunfw && sudo make install )
          ( cd libkrun && sudo make install BLK=1 NET=1 )
          # libkrun installs into /usr/local/lib64 (with the libkrun.so dev
          # symlink + a pkg-config file). Point pkg-config (used by build.rs) and
          # the runtime loader at it.
          echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/libkrun.conf
          sudo ldconfig
          ls -l /usr/local/lib64/libkrun.so*

      - name: Build bsdkrun
        run: cargo build --release

      - name: Build guest agent (static musl)
        run: |
          set -eux
          ( cd agent && cargo build --release --target x86_64-unknown-linux-musl )
          echo "BSDKRUN_AGENT_LINUX=$PWD/agent/target/x86_64-unknown-linux-musl/release/bsdkrun-agent" >> "$GITHUB_ENV"

      - name: e2e — boot an OCI microVM (detached) and exec a command
        run: |
          set -eux
          # Use the detached path: it wires the guest console to a per-machine PTY
          # broker, so it works without the CI step having a real TTY on stdout
          # (libkrun's implicit console only writes to a tty). `logs` then shows
          # the boot; `exec` runs a command via the in-guest agent.
          id=$(./target/release/bsdkrun --log-level 5 linux -d alpine -- sleep 300)
          sleep 3
          ./target/release/bsdkrun ps
          echo "----- guest console -----"
          ./target/release/bsdkrun logs "$id" | tail -40 || true
          out=$(timeout 30 ./target/release/bsdkrun exec "$id" echo hello-from-kvm || true)
          ./target/release/bsdkrun stop "$id" || true
          echo "$out" | grep -q hello-from-kvm

      - name: e2e — detached machine + exec + volume persistence
        run: |
          set -eux
          id=$(./target/release/bsdkrun linux -d -v ci alpine -- sleep 60)
          sleep 5
          timeout 30 ./target/release/bsdkrun exec "$id" uname -a
          timeout 30 ./target/release/bsdkrun exec "$id" /bin/sh -c 'echo persisted > /root/x'
          ./target/release/bsdkrun stop "$id"
          # reboot the volume, confirm persistence
          id2=$(./target/release/bsdkrun linux -d -v ci alpine -- sleep 60)
          sleep 5
          timeout 30 ./target/release/bsdkrun exec "$id2" cat /root/x | grep -q persisted
          ./target/release/bsdkrun volume ls
          ./target/release/bsdkrun stop "$id2"

      # The agent doubles as a feature CLI (ssh/tailscale/systemd) driven by the
      # matching host wrappers. ssh is the full loop: agent installs the key,
      # then we REALLY ssh in through a forwarded port.
      - name: e2e — ssh setup (Linux guest)
        run: |
          set -eux
          ssh-keygen -t ed25519 -N '' -q -f ci_key
          id=$(./target/release/bsdkrun linux -d --port 2222:22 alpine -- sleep 300)
          sleep 5
          # alpine images ship root LOCKED (shadow "root:!..."), and sshd
          # refuses even key logins for locked accounts — unlock to "no
          # password" (key-only logins still enforced by prohibit-password).
          timeout 30 ./target/release/bsdkrun exec "$id" /bin/sh -c \
            "sed -i 's/^root:!:/root::/' /etc/shadow"
          ./target/release/bsdkrun ssh "$id" setup --key ci_key.pub
          ./target/release/bsdkrun ssh "$id" status
          out=""
          for i in $(seq 1 10); do
            out=$(ssh -i ci_key -p 2222 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
              -o ConnectTimeout=5 root@127.0.0.1 uname -a 2>/dev/null || true)
            [ -n "$out" ] && break
            sleep 3
          done
          echo "ssh says: $out"
          ./target/release/bsdkrun stop "$id" || true
          echo "$out" | grep -q Linux
          echo "🎉 ssh into the Linux guest works (agent-installed key)"

      # No tailnet auth key in CI, so this validates install (apk) + daemon
      # start + status reachability; with a TS_AUTHKEY secret set it goes all
      # the way to `tailscale up` and checks for a tailnet IP.
      - name: e2e — tailscale (Linux guest)
        continue-on-error: true
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux
          id=$(./target/release/bsdkrun linux -d alpine -- sleep 300)
          sleep 5
          ./target/release/bsdkrun tailscale "$id" install
          ./target/release/bsdkrun tailscale "$id" start
          if [ -n "${TS_AUTHKEY:-}" ]; then
            ./target/release/bsdkrun tailscale "$id" setup --hostname bsdkrun-ci
            ./target/release/bsdkrun tailscale "$id" status | tee ts.out
            grep -Eq '(^| )100\.' ts.out
            echo "🎉 tailscale joined the tailnet (userspace networking)"
          else
            # logged-out status exits nonzero but must answer over the socket
            ./target/release/bsdkrun tailscale "$id" status >ts.out 2>&1 || true
            cat ts.out
            grep -Eiq 'logged out|log in|stopped|needslogin' ts.out
            echo "🎉 tailscaled installed + running (no auth key in CI)"
          fi
          ./target/release/bsdkrun stop "$id" || true

      # systemd handoff: setup on a volume-backed debian guest, reboot, and the
      # generated init execs systemd as PID 1; the agent survives as a unit.
      - name: e2e — systemd as PID 1 (debian + volume)
        continue-on-error: true
        run: |
          set -eux
          id=$(./target/release/bsdkrun linux -d -v sysd debian -- sleep 300)
          sleep 8
          timeout 420 ./target/release/bsdkrun systemd "$id" setup
          ./target/release/bsdkrun systemd "$id" status
          ./target/release/bsdkrun stop "$id"
          # second boot, same volume -> marker + packages persisted -> systemd
          id2=$(./target/release/bsdkrun linux -d -v sysd debian -- sleep 300)
          sleep 15
          ./target/release/bsdkrun ps || true
          ./target/release/bsdkrun logs "$id2" 2>/dev/null | tail -25 || true
          ./target/release/bsdkrun systemd "$id2" status | tee sd.out
          grep -Eq 'PID 1:.*systemd' sd.out
          # exec still works because the bsdkrun-agent.service unit owns the agent
          timeout 60 ./target/release/bsdkrun exec "$id2" systemctl is-system-running --wait || true
          timeout 30 ./target/release/bsdkrun exec "$id2" systemctl is-active bsdkrun-agent.service
          ./target/release/bsdkrun stop "$id2" || true
          echo "🎉 systemd is PID 1 after reboot; agent unit active"

      # NetBSD boots via direct kernel — no EFI firmware — so it can run on
      # Linux/KVM too. amd64 direct-boots the bundled MICROVM kernel (PVH, via our
      # libkrun fork's KRUN_PVH path) + FFS rootfs (root=ld0a). The guest agent is
      # baked into that image (rc.d), so `exec` is the definitive boot test.
      # Experimental (continue-on-error).
      - name: e2e — NetBSD (direct kernel, PVH)
        continue-on-error: true
        run: |
          set -eux
          id=$(./target/release/bsdkrun --log-level 5 netbsd -d --port 2223:22)
          # A microVM boots in seconds — poll the baked-in agent with exec early
          # and often instead of one long fixed sleep.
          sleep 5
          ./target/release/bsdkrun ps || true
          out=""
          for i in $(seq 1 12); do
            out=$(timeout 30 ./target/release/bsdkrun exec "$id" uname -a 2>/dev/null || true)
            [ -n "$out" ] && break
            sleep 5
          done
          echo "exec uname -a: $out"
          # Agent feature CLIs (soft-fail: the whole step is experimental).
          # ssh: NetBSD's default sshd_config has an explicit PermitRootLogin
          # no, so this also exercises the agent's prohibit-password rewrite.
          if [ -n "$out" ]; then
            ssh-keygen -t ed25519 -N '' -q -f nb_key
            ./target/release/bsdkrun ssh "$id" setup --key nb_key.pub || true
            sshout=""
            for i in 1 2 3 4 5; do
              sshout=$(ssh -i nb_key -p 2223 -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
                -o ConnectTimeout=5 root@127.0.0.1 uname -s 2>/dev/null || true)
              [ -n "$sshout" ] && break
              sleep 3
            done
            echo "ssh says: $sshout"
            if [ "$sshout" = "NetBSD" ]; then echo "🎉 ssh into NetBSD works (agent-installed key)"; fi
            # tailscale via pkg_add from the pkgsrc CDN (no auth key: install+start only)
            ./target/release/bsdkrun tailscale "$id" install || true
            ./target/release/bsdkrun tailscale "$id" start || true
            ./target/release/bsdkrun tailscale "$id" status || true
          fi
          # console=com is now on the amd64 cmdline, so the guest console (dmesg,
          # rc, any panic or prompt) lands in console.log — show both ends.
          echo "----- console (head: kernel banner + autoconf) -----"
          ./target/release/bsdkrun logs "$id" 2>/dev/null > nb.log || true
          head -80 nb.log || true
          echo "----- console (tail: rc / where boot currently is) -----"
          tail -40 nb.log || true
          ./target/release/bsdkrun stop "$id" 2>/dev/null || true
          if echo "$out" | grep -q "NetBSD"; then
            echo "🎉 NetBSD amd64 BOOTED under libkrun (PVH) — agent exec works"
          elif grep -qE "Copyright .c. 19.* The NetBSD Foundation|NetBSD [0-9]" nb.log; then
            echo "NetBSD booted (console banner seen); agent not reachable yet"
          else
            echo "NetBSD executing but not confirmed (no exec reply, no console captured)"
          fi

      # FreeBSD amd64 also direct-boots via PVH (the bundled FIRECRACKER kernel:
      # no ACPI, MPTable, virtio-mmio + serial built in). libkrun advertises its
      # virtio-mmio devices in FreeBSD's numbered-key cmdline form
      # (virtio_mmio.device=, virtio_mmio.device_1=, ... — KRUN_VIRTIO_MMIO_HINTS,
      # set by bsdkrun). Experimental (continue-on-error), and a no-op until the
      # release-freebsd-amd64-image workflow has published the assets.
      - name: e2e — FreeBSD (direct kernel, PVH)
        continue-on-error: true
        run: |
          set -eux
          id=$(./target/release/bsdkrun --log-level 5 freebsd -d --port 2224:22)
          sleep 5
          ./target/release/bsdkrun ps || true
          out=""
          for i in $(seq 1 12); do
            out=$(timeout 30 ./target/release/bsdkrun exec "$id" uname -a 2>/dev/null || true)
            [ -n "$out" ] && break
            sleep 5
          done
          echo "exec uname -a: $out"
          # Agent feature CLIs (soft-fail: the whole step is experimental).
          # ssh: FreeBSD's default sshd_config also says PermitRootLogin no —
          # exercises the agent's prohibit-password rewrite + sysrc/service path.
          if [ -n "$out" ]; then
            ssh-keygen -t ed25519 -N '' -q -f fb_key
            ./target/release/bsdkrun ssh "$id" setup --key fb_key.pub || true
            sshout=""
            for i in 1 2 3 4 5; do
              sshout=$(ssh -i fb_key -p 2224 -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes \
                -o ConnectTimeout=5 root@127.0.0.1 uname -s 2>/dev/null || true)
              [ -n "$sshout" ] && break
              sleep 3
            done
            echo "ssh says: $sshout"
            if [ "$sshout" = "FreeBSD" ]; then echo "🎉 ssh into FreeBSD works (agent-installed key)"; fi
            # tailscale via pkg (bootstraps pkg itself; no auth key: install+start only)
            ./target/release/bsdkrun tailscale "$id" install || true
            ./target/release/bsdkrun tailscale "$id" start || true
            ./target/release/bsdkrun tailscale "$id" status || true
          fi
          echo "----- console (head: kernel banner + device probe) -----"
          ./target/release/bsdkrun logs "$id" 2>/dev/null > fb.log || true
          head -80 fb.log || true
          echo "----- console (tail: rc / where boot currently is) -----"
          tail -40 fb.log || true
          ./target/release/bsdkrun stop "$id" 2>/dev/null || true
          if echo "$out" | grep -q "FreeBSD"; then
            echo "🎉 FreeBSD amd64 BOOTED under libkrun (PVH) — agent exec works"
          elif grep -qE "FreeBSD .* GENERIC|Copyright .c. 19.* The FreeBSD" fb.log; then
            echo "FreeBSD booted (console banner seen); agent not reachable yet"
          else
            echo "FreeBSD executing but not confirmed (no exec reply, no console captured)"
          fi
