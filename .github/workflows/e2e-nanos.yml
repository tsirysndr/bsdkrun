name: e2e (Nanos / KVM)

# Builds a Nanos unikernel with ops and boots it on x86_64/KVM via bsdkrun's
# direct-kernel path — the same boot contract Firecracker uses, which Nanos
# supports officially.
#
# EXPERIMENTAL: this is the first time Nanos meets libkrun on x86_64, so the
# job is continue-on-error — a red here means "nanos support isn't there yet",
# and must not block main. Flip it to a hard test once it has gone green.
# (The arm64 side is blocked on an upstream Nanos UEFI-loader hang; see
# examples/nanos-hello/README.md for the full story.)

on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
    paths:
      - "examples/nanos-hello/**"
      - ".github/workflows/e2e-nanos.yml"

permissions:
  contents: read

jobs:
  boot:
    name: x86_64
    runs-on: ubuntu-latest # x86_64; has /dev/kvm
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm

      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils python3 \
            python3-pyelftools pkg-config patchelf patch cpio kmod rsync zstd \
            flex bison bc libelf-dev libssl-dev clang libclang-dev llvm-dev

      # Same cache key as the other e2e workflows. NB: a cache hit restores a
      # libkrun built from feat/pvh-boot at bump time; the x86_64 direct-kernel
      # path needs nothing newer.
      - name: Restore libkrun build
        id: libkrun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v15

      - name: Build libkrun (cache miss)
        if: steps.libkrun-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 -b v5.5.0 https://github.com/containers/libkrunfw
          ( cd libkrunfw && make -j"$(nproc)" && sudo make install )
          git clone --depth 1 -b feat/pvh-boot https://github.com/tsirysndr/libkrun
          ( cd libkrun && make -j"$(nproc)" BLK=1 NET=1 )

      - name: Save libkrun build
        if: steps.libkrun-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v15

      - name: Install libkrun
        run: |
          set -eux
          ( cd libkrunfw && sudo make install )
          ( cd libkrun && sudo make install BLK=1 NET=1 )
          echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/libkrun.conf
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build bsdkrun
        run: cargo build --release

      # Fetch the ops binary directly instead of running ops.city/get.sh: that
      # installer shells out to `apt install qemu-system-x86` without sudo (so
      # it dies on the dpkg lock) and then refuses to continue without QEMU —
      # which only `ops run` needs. Here ops is a *builder* and bsdkrun is the
      # VMM, so none of it applies. Same URL and install prefix the script uses.
      - name: Install ops and build the Nanos image
        working-directory: examples/nanos-hello
        run: |
          set -eux
          mkdir -p "$HOME/.ops/bin"
          curl -fsSLo "$HOME/.ops/bin/ops" https://storage.googleapis.com/cli/linux/ops
          chmod +x "$HOME/.ops/bin/ops"
          export PATH="$HOME/.ops/bin:$PATH"
          ops version
          ./build.sh x86_64
          ls -l "$HOME/.ops/images/nanos-hello"

      - name: e2e — boot Nanos with `bsdkrun nanos`
        run: |
          set -eux
          # The subcommand finds the ops-staged kernel and picks the x86_64
          # direct-kernel boot method itself. A bare image name resolves
          # against ~/.ops/images.
          export PATH="$HOME/.ops/bin:$PATH"
          timeout 120 ./target/release/bsdkrun --log-level 5 nanos nanos-hello \
            --cpus 1 --mem 512 --no-net | tee nanos.out || true
          if grep -aq "Hello from Nanos" nanos.out; then
            echo "🎉 Nanos BOOTED under libkrun/KVM (x86_64 direct kernel)"
          else
            echo "Nanos did not boot — console above is the artifact to read"
            exit 1
          fi

      - name: Upload console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanos-console
          path: nanos.out
          if-no-files-found: ignore
