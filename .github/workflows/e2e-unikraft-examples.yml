name: e2e (Unikraft examples / KVM)

# Builds each Unikraft example for fc/x86_64 and boots it with `bsdkrun
# unikraft` under KVM, then checks the server answers over a forwarded port.
#
# x86_64 only: GitHub's arm64 runners do not expose /dev/kvm, and these examples
# need a VMM. The arm64 side is exercised on a macOS/HVF host by hand.
#
# `strict: false` marks an example whose HTTP check is allowed to fail without
# failing the job. It means the runtime is not known to work on x86_64 yet, not
# that a failure is acceptable -- the step still runs and its result is printed,
# so this workflow is how that status gets established. Flip it to true the
# first time it passes, so a later regression is caught.
#
# Asserts the whole chain: the patches applied, the unikernel builds, it boots,
# the guest gets a network interface, the application starts, and the server
# answers over the forwarded port.
#
# On x86_64 there is no device tree, so the guest learns about its NIC solely
# from the `virtio_mmio.device=` parameters libkrun appends. That path needs the
# virtio-mmio probe fix in library/unikraft-base/patches: libkrun attaches the
# memory balloon first, Unikraft has no driver for it, and unpatched the probe
# loop gives up there — losing the entropy and network devices behind it.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
    paths:
      - "examples/unikraft-expressjs/**"
      - "examples/unikraft-actix/**"
      - "examples/unikraft-deno/**"
      - "examples/unikraft-bun/**"
      - "examples/unikraft-clojure/**"
      - "examples/unikraft-mysql/**"
      - "library/unikraft-base/**"
      - "src/**"
      - ".github/workflows/e2e-unikraft-examples.yml"

permissions:
  contents: read

jobs:
  boot:
    name: ${{ matrix.example }} (x86_64)
    runs-on: ubuntu-latest # x86_64; has /dev/kvm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: unikraft-expressjs
            kernel: expressjs_fc-x86_64
            # node needs the rootfs resident twice (embedded in the image and
            # unpacked into ramfs) before V8 allocates anything; 512 MiB fails
            # during cpio extraction with a misleading "Input/output error".
            mem: 2048
            argv: /usr/bin/node /usr/src/server.js
            port: 3000
            expect: "Bye, World!"
            strict: true
          - example: unikraft-actix
            kernel: actix_fc-x86_64
            mem: 1024
            argv: /server
            port: 8080
            expect: "Bye, World!"
            strict: true
          - example: unikraft-deno
            kernel: deno_fc-x86_64
            # As with node: the rootfs is resident twice (embedded in the image
            # and unpacked into ramfs) before V8 allocates anything.
            mem: 2048
            # --quiet is required, not cosmetic. Deno's progress bar otherwise
            # redraws in a tight loop and starves the thread doing the real
            # work; see examples/unikraft-deno/README.md.
            argv: /usr/bin/deno run --quiet --allow-net /usr/src/server.js
            port: 3000
            expect: "Hello from Deno on Unikraft!"
            strict: true
          - example: unikraft-bun
            kernel: bun_fc-x86_64
            mem: 2048
            argv: /usr/bin/bun run /usr/src/server.js
            port: 3000
            expect: "Hello from Bun on Unikraft!"
            # Bun aborts inside JavaScriptCore's heap setup on arm64 (see
            # examples/unikraft-bun/README.md). Whether x86_64 is affected has
            # never been tested -- there is no x86_64 host to hand -- so this
            # job is the test. Non-strict until it is known to pass.
            strict: false
          - example: unikraft-clojure
            kernel: clojure_fc-x86_64
            # A jlink'ed runtime and one uberjar come to 37 MiB, so unlike node
            # and Deno this boots in the default 512 MiB even with the rootfs
            # resident twice. 1024 here only because x86_64 has never been
            # measured; arm64 was.
            mem: 1024
            # The JVM flags are load-bearing, not tuning -- see the Kraftfile.
            argv: >-
              /opt/jre/bin/java -XX:+UseSerialGC -XX:ActiveProcessorCount=1
              -XX:-UseContainerSupport -XX:-UsePerfData -XX:TieredStopAtLevel=1
              -Xmx256m -jar /usr/src/server.jar
            port: 3000
            expect: "Hello from Clojure on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run, so
            # this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-mysql
            kernel: mysql_fc-x86_64
            # 152 MiB of root filesystem (a 53 MiB mysqld and an 87 MiB
            # pre-initialised datadir), resident twice at boot.
            mem: 2048
            # The rest of the server's options are /etc/my.cnf inside the image.
            argv: /usr/sbin/mysqld --user=root
            port: 3306
            # Not HTTP: the check reads MySQL's initial handshake packet, which
            # carries the server version as a NUL-terminated string.
            probe: mysql
            expect: "8.0.46"
            # mysqld wedges the moment it creates its second thread (see
            # examples/unikraft-mysql/README.md). This job is what established
            # that it happens on x86_64 too, at the same last line -- so the
            # steps above still assert the build, the boot, the interface and
            # entropy, and this one stays non-strict until the hang is fixed.
            strict: false
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      - name: Install build deps (bsdkrun, libkrun/libkrunfw, and Unikraft)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils python3 \
            python3-pyelftools pkg-config patchelf patch cpio kmod rsync zstd \
            flex bison bc libelf-dev libssl-dev libncurses-dev libyaml-dev \
            uuid-runtime unzip wget clang libclang-dev llvm-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # --port forwards a host port into the guest, which is user-mode
      # networking; without gvproxy on PATH the machine refuses to start.
      - name: Install gvproxy (user-mode networking)
        run: |
          set -eux
          sudo curl -fL -o /usr/local/bin/gvproxy \
            https://github.com/containers/gvisor-tap-vsock/releases/latest/download/gvproxy-linux-amd64
          sudo chmod +x /usr/local/bin/gvproxy
          gvproxy --help >/dev/null 2>&1 || which gvproxy

      # Same cache key as e2e-linux.yml and e2e-unikraft.yml on purpose: a hit
      # from any of them saves the ~15-20 min libkrunfw kernel compile.
      - name: Restore libkrun build
        id: libkrun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v16

      - name: Build libkrun (cache miss)
        if: steps.libkrun-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 -b v5.5.0 https://github.com/containers/libkrunfw
          ( cd libkrunfw && make -j"$(nproc)" && sudo make install )
          git clone --depth 1 -b feat/pvh-boot https://github.com/tsirysndr/libkrun
          ( cd libkrun && make -j"$(nproc)" BLK=1 NET=1 )

      - name: Save libkrun build
        if: steps.libkrun-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v16

      - name: Install libkrun
        run: |
          set -eux
          ( cd libkrunfw && sudo make install )
          ( cd libkrun && sudo make install BLK=1 NET=1 )
          echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/libkrun.conf
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build bsdkrun
        run: cargo build --release

      - name: Install kraft
        run: |
          set -eux
          curl -fsSLo /tmp/kraft.deb \
            "https://github.com/unikraft/kraftkit/releases/download/v${KRAFT_VERSION}/kraftkit_${KRAFT_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/kraft.deb
          kraft version
        env:
          KRAFT_VERSION: 0.12.15

      # build.sh runs the kraft half natively on Linux (no container), and
      # builds the rootfs with buildx for the target arch. Here host and target
      # are both x86_64, so no emulation is involved.
      - name: Build the example
        run: |
          set -eux
          ./examples/${{ matrix.example }}/build.sh x86_64
          ls -l examples/${{ matrix.example }}/.unikraft/build/${{ matrix.kernel }}
        env:
          KRAFTKIT_NO_PROMPT: "1"

      # The patches are what make the elfloader build work; if apply.sh silently
      # did nothing, the driver would be missing and entropy would be gone.
      - name: Assert the patches were applied
        run: |
          set -eux
          cfg=examples/${{ matrix.example }}/.config.${{ matrix.kernel }}
          grep -q '^CONFIG_LIBVIRTIO_RNG=y' "$cfg"
          grep -q '^CONFIG_FPSIMD=y' "$cfg" || true # arm64-only symbol
          test -f examples/${{ matrix.example }}/.unikraft/unikraft/drivers/virtio/rng/virtio_rng.c
          echo "--- virtio-mmio cmdline device budget ---"
          grep -E '^CONFIG_(LIBVIRTIO_MMIO|VIRTIO_MMIO_MAX_DEV_CMDLINE|VIRTIO_MMIO_LINUX_COMPAT_CMDLINE)' "$cfg"

      # `<argv0> -- <application argv>`: everything before `--` is parsed as
      # kernel library parameters and the first word is skipped (Unikraft treats
      # it as the program name), so the placeholder is required.
      - name: e2e — boot the unikernel
        run: |
          set -eux
          ./target/release/bsdkrun unikraft -d \
            --name ${{ matrix.example }} \
            --mem ${{ matrix.mem }} \
            --port ${{ matrix.port }}:${{ matrix.port }} \
            --cmdline "elfloader -- ${{ matrix.argv }}" \
            examples/${{ matrix.example }} | tee id.txt
          sleep 20
          ./target/release/bsdkrun ps -a
          ./target/release/bsdkrun logs "$(cat id.txt)" | tee uk-${{ matrix.example }}.out
          # bsdkrun's own log records the assembled kernel command line. On
          # x86_64 that is the only place the NIC is advertised to the guest
          # (`virtio_mmio.device=`), so it is what to read when no interface
          # shows up.
          cp -v "$HOME/.local/state/bsdkrun/machines/$(cat id.txt)/bsdkrun.log" \
            uk-${{ matrix.example }}-boot.out || true

      # Boot milestones, asserted in order so a failure names the earliest
      # stage that broke rather than a symptom further down.
      - name: e2e — kernel came up
        run: |
          set -eux
          out=uk-${{ matrix.example }}.out
          echo "::group::guest console"
          cat "$out" || true
          echo "::endgroup::"
          grep -q "Powered by Unikraft" "$out"

      - name: e2e — networking and entropy
        run: |
          set -eu
          out=uk-${{ matrix.example }}.out
          boot=uk-${{ matrix.example }}-boot.out
          echo "::group::bsdkrun boot log (kernel cmdline, device setup)"
          cat "$boot" 2>/dev/null || echo "(no boot log)"
          echo "::endgroup::"
          # Order matters: assert the interface first. Without it lwip never
          # starts, so the entropy grep would pass vacuously.
          #
          # On x86_64 there is no device tree, so the guest learns about its
          # NIC solely from the `virtio_mmio.device=` parameters libkrun
          # appends. Getting an address here is therefore also a test of the
          # virtio-mmio probe fix in library/unikraft-base/patches.
          grep -q "Set IPv4 address" "$out"
          ! grep -q "Could not obtain randomness" "$out"

      # The payoff assertion: the guest ran the application and it answered over
      # the forwarded port. `continue-on-error` applies only to examples marked
      # `strict: false` in the matrix -- see the top of this file for what that
      # means and when to clear it.
      #
      # `probe: mysql` selects a protocol check instead of an HTTP one, for the
      # example that does not speak HTTP. A MySQL server sends its handshake
      # unprompted on connect, so reading the first bytes is enough; the version
      # sits in there as a NUL-terminated string. bash's /dev/tcp is used rather
      # than a client package, to keep the runner free of a MySQL install.
      - name: e2e — server answers
        id: http
        continue-on-error: ${{ !matrix.strict }}
        run: |
          set -eu
          for i in $(seq 1 45); do
            if [ "${{ matrix.probe }}" = mysql ]; then
              if timeout 5 bash -c \
                   'exec 3<>/dev/tcp/127.0.0.1/${{ matrix.port }}; head -c 128 <&3' \
                   > body.bin 2>/dev/null && [ -s body.bin ]; then
                tr -d '\000' < body.bin > body.txt
                break
              fi
            elif curl -fsS --max-time 5 "http://127.0.0.1:${{ matrix.port }}/" -o body.txt; then
              break
            fi
            sleep 2
          done
          test -s body.txt || { echo "no response from the guest"; exit 1; }
          cat body.txt
          grep -a -q "${{ matrix.expect }}" body.txt

      # Make a non-strict result visible in the job summary rather than leaving
      # it buried in a green tick.
      - name: Report non-strict outcome
        if: ${{ !matrix.strict }}
        run: |
          set -eu
          if [ "${{ steps.http.outcome }}" = success ]; then
            echo "### ${{ matrix.example }}: HTTP check PASSED on x86_64" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "It is no longer known-failing here. Set \`strict: true\` for this" \
                 "matrix entry so a regression fails the job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.example }}: HTTP check failed (known, not fatal)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See examples/${{ matrix.example }}/README.md. The console log is" \
                 "attached as an artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tear down
        if: always()
        run: |
          set -eux
          ./target/release/bsdkrun rm -f "$(cat id.txt)" || true

      - name: Upload console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unikraft-${{ matrix.example }}-console
          path: uk-*.out
          if-no-files-found: ignore
