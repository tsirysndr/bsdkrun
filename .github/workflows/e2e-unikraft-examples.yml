name: e2e (Unikraft examples / KVM)

# Builds each Unikraft example for fc/x86_64 and boots it with `bsdkrun
# unikraft` under KVM, then checks the server answers over a forwarded port.
#
# x86_64 only: GitHub's arm64 runners do not expose /dev/kvm, and these examples
# need a VMM. The arm64 side is exercised on a macOS/HVF host by hand.
#
# `strict: false` marks an example whose HTTP check is allowed to fail without
# failing the job. It means the runtime is not known to work on x86_64 yet, not
# that a failure is acceptable -- the step still runs and its result is printed,
# so this workflow is how that status gets established. Flip it to true the
# first time it passes, so a later regression is caught.
#
# Asserts the whole chain: the patches applied, the unikernel builds, it boots,
# the guest gets a network interface, the application starts, and the server
# answers over the forwarded port.
#
# On x86_64 there is no device tree, so the guest learns about its NIC solely
# from the `virtio_mmio.device=` parameters libkrun appends. That path needs the
# virtio-mmio probe fix in library/unikraft-base/patches: libkrun attaches the
# memory balloon first, Unikraft has no driver for it, and unpatched the probe
# loop gives up there — losing the entropy and network devices behind it.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
    paths:
      - "examples/unikraft-expressjs/**"
      - "examples/unikraft-actix/**"
      - "examples/unikraft-deno/**"
      - "examples/unikraft-bun/**"
      - "examples/unikraft-clojure/**"
      - "examples/unikraft-mysql/**"
      - "examples/unikraft-elixir/**"
      - "examples/unikraft-gleam/**"
      - "examples/unikraft-postgres/**"
      - "examples/unikraft-redis/**"
      - "examples/unikraft-dragonflydb/**"
      - "examples/unikraft-mariadb/**"
      - "examples/unikraft-mongodb/**"
      - "examples/unikraft-php/**"
      - "examples/unikraft-python/**"
      - "examples/unikraft-haskell/**"
      - "examples/unikraft-laravel/**"
      - "examples/unikraft-symfony/**"
      - "examples/unikraft-static/**"
      - "examples/unikraft-crystal/**"
      - "examples/unikraft-zig/**"
      - "examples/unikraft-java/**"
      - "examples/unikraft-scala/**"
      - "examples/unikraft-swift/**"
      - "examples/unikraft-dotnet/**"
      - "examples/unikraft-ruby/**"
      - "examples/unikraft-rails/**"
      - "examples/unikraft-caddy/**"
      - "examples/unikraft-nginx/**"
      - "examples/unikraft-apache/**"
      - "examples/unikraft-wasmer/**"
      - "library/unikraft-base/**"
      - "src/**"
      - ".github/workflows/e2e-unikraft-examples.yml"

permissions:
  contents: read

jobs:
  boot:
    name: ${{ matrix.example }} (x86_64)
    runs-on: ubuntu-latest # x86_64; has /dev/kvm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: unikraft-expressjs
            kernel: node_fc-x86_64
            pack: true
            placeholder: node
            # node needs the rootfs resident twice (embedded in the image and
            # unpacked into ramfs) before V8 allocates anything; 512 MiB fails
            # during cpio extraction with a misleading "Input/output error".
            mem: 2048
            argv: /usr/bin/node /usr/src/app/index.js
            port: 3000
            expect: "Bye, World!"
            strict: true
          - example: unikraft-actix
            kernel: hello_fc-x86_64
            pack: true
            placeholder: hello
            mem: 1024
            argv: /hello
            port: 8080
            expect: "Bye, World!"
            strict: true
          - example: unikraft-deno
            kernel: deno_fc-x86_64
            pack: true
            placeholder: deno
            # As with node: the rootfs is resident twice (embedded in the image
            # and unpacked into ramfs) before V8 allocates anything.
            mem: 2048
            # --quiet is required, not cosmetic. Deno's progress bar otherwise
            # redraws in a tight loop and starves the thread doing the real
            # work; see examples/unikraft-deno/README.md.
            argv: /usr/bin/deno run --quiet --allow-net /usr/src/app/server.js
            port: 3000
            expect: "Hello from Deno on Unikraft!"
            strict: true
          - example: unikraft-bun
            kernel: bun_fc-x86_64
            pack: true
            placeholder: bun
            mem: 2048
            argv: /usr/bin/bun run /usr/src/app/server.js
            port: 3000
            expect: "Hello from Bun on Unikraft!"
            # Bun serves on arm64 now. It needed two syscalls Unikraft was
            # missing -- mremap, and epoll_pwait with a signal mask -- both in
            # library/unikraft-base/patches; see examples/unikraft-bun/README.md.
            # Neither fix is architecture-specific, so this should pass here
            # too, but this job is the only x86_64 host available and it has
            # not run since. Left non-strict for one green run; the step
            # summary says to flip it.
            strict: false
          - example: unikraft-clojure
            kernel: clojure_fc-x86_64
            pack: true
            placeholder: clojure
            # A jlink'ed runtime and one uberjar come to 37 MiB, so unlike node
            # and Deno this boots in the default 512 MiB even with the rootfs
            # resident twice. 1024 here only because x86_64 has never been
            # measured; arm64 was.
            mem: 1024
            # The JVM flags are load-bearing, not tuning -- see the Kraftfile.
            argv: /opt/jre/bin/java -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:-UseContainerSupport -XX:-UsePerfData -XX:TieredStopAtLevel=1 -Xmx256m -jar /usr/src/server.jar
            port: 3000
            expect: "Hello from Clojure on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run, so
            # this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-mysql
            kernel: mysql_fc-x86_64
            # 152 MiB of root filesystem (a 53 MiB mysqld and an 87 MiB
            # pre-initialised datadir), resident twice at boot.
            mem: 2048
            # The rest of the server's options are /etc/my.cnf inside the image.
            argv: /usr/sbin/mysqld --user=root
            port: 3306
            # Not HTTP: the check runs a real query -- create a database and a
            # table, insert a row, read it back -- so a green run means the
            # server parsed SQL, wrote to InnoDB and returned a result set, not
            # merely that it opened a socket.
            probe: mysql
            expect: "unikraft-on-bsdkrun"
            strict: true
          - example: unikraft-elixir
            kernel: server_fc-x86_64
            pack: true
            placeholder: server
            # 68 MiB of root filesystem (a 37 MiB beam.smp, eight OTP
            # applications and the release), resident twice at boot.
            mem: 1024
            # The emulator is started directly, with the argument vector
            # `erlexec` would have built -- there is no shell to run the
            # release's start script. The trailing `-extra` is load-bearing:
            # libkrun appends its own hints to the command line and they arrive
            # as argv. See examples/unikraft-elixir/README.md.
            argv: /erl/erts/bin/beam.smp -fnu -- -root /erl -bindir /erl/erts/bin -progname erl -- -home /root -- -noshell -mode embedded -config /srv/releases/0.1.0/sys -boot /srv/releases/0.1.0/start -boot_var RELEASE_LIB /srv/lib -- -extra
            port: 3000
            expect: "Hello from Elixir on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run, so
            # this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-gleam
            kernel: wisp_demo_fc-x86_64
            pack: true
            placeholder: wisp_demo
            # 50 MiB of root filesystem (beam.smp, six OTP applications and a
            # 2 MiB shipment), resident twice at boot.
            mem: 1024
            # Gleam's generated entrypoint.sh passes `-pa "$BASE"/*/ebin`, which
            # expands to 21 arguments; ERL_LIBS in the Kraftfile replaces them.
            # The trailing `--` is load-bearing: libkrun appends its own hints
            # to the command line and they arrive as argv. See
            # examples/unikraft-gleam/README.md.
            argv: /erl/erts/bin/beam.smp -fnu -- -root /erl -bindir /erl/erts/bin -progname erl -- -home /root -- -noshell -eval wisp_demo@@main:run(wisp_demo) --
            port: 3000
            expect: "Hello from Gleam on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run, so
            # this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-postgres
            kernel: postgres_fc-x86_64
            # 55 MiB of root filesystem (an 8 MiB postgres, a 37 MiB cluster
            # initialised at image build time, and busybox), resident twice.
            mem: 2048
            # A real postmaster, not single-user mode: PostgreSQL is built
            # -DEXEC_BACKEND, so every child it starts -- checkpointer, WAL
            # writer, one backend per connection -- is a spawn rather than a
            # fork, which is what Unikraft supports. See
            # examples/unikraft-postgres/README.md.
            #
            # No trailing argument is needed to absorb the hints libkrun
            # appends: they arrive after `-D <dir>`, and PostgreSQL's getopt
            # consumes the `--` it ends up with.
            argv: /usr/local/bin/postgres -D /var/lib/postgresql/data
            port: 5432
            # Like mysql, this runs a real query rather than an HTTP request:
            # a green run means the postmaster spawned a backend process for
            # the connection (posix_spawn + execve — there is no fork) and
            # that backend planned and executed SQL.
            probe: postgres
            expect: "unikraft-on-bsdkrun"
            # Strict: serving SQL end to end on both architectures took seven
            # patches in library/unikraft-base/patches (15-16, 18-22) — three
            # of which (19, 20, 22) were kernel bugs that no other example
            # exercises — so a regression here is a kernel regression, and it
            # must be loud. See examples/unikraft-postgres/README.md.
            strict: true
          - example: unikraft-redis
            kernel: redis_fc-x86_64
            # ~7 MiB of root filesystem (redis-server, four libraries and
            # busybox); 512 covers it twice over.
            mem: 512
            # `sh /start.sh`, not redis-server directly: libkrun appends its
            # own words to the boot argv and redis-server fatals on the first
            # one ("Bad directive or wrong number of arguments"). The script
            # absorbs them as positional parameters and exec()s the server
            # with a clean argv. See examples/unikraft-redis/README.md.
            argv: /bin/sh /start.sh
            port: 6379
            # Not HTTP: a SET then a GET, so a green run means the server
            # parsed RESP and round-tripped a value.
            probe: redis
            expect: "unikraft-on-bsdkrun"
            # Verified end to end on arm64/macOS (which is where the argv
            # trampoline and the ARM64-COW-BUG ignore were established -- see
            # the README); x86_64 has never been run, so this job is the
            # test. Non-strict until it passes.
            strict: false
          - example: unikraft-dragonflydb
            kernel: dragonflydb_fc-x86_64
            # A ~50 MiB mostly-static binary, resident twice at boot.
            mem: 1024
            # --force_epoll: there is no io_uring under Unikraft, and without
            # the flag dragonfly aborts probing for it. --maxmemory: with no
            # cgroup to read a limit from, dragonfly must be told its budget.
            # --alsologtostderr: glog otherwise writes to /tmp inside the
            # guest, and the uploaded console artifact would say nothing.
            # No trampoline script: abseil's flag parser ignores the
            # positional junk libkrun appends to argv.
            argv: /usr/bin/dragonfly --force_epoll --maxmemory=256mb --alsologtostderr
            port: 6379
            # Dragonfly speaks the Redis protocol, so it shares the redis
            # probe.
            probe: redis
            expect: "unikraft-on-bsdkrun"
            # Verified end to end on arm64/macOS (it needed the epoll flag and
            # a fake cgroup2 file surface baked into the image -- see the
            # README); x86_64 has never been run, so this job is the test.
            # Non-strict until it passes.
            strict: false
          - example: unikraft-mariadb
            kernel: mariadb_fc-x86_64
            # Like mysql: a large server binary and a datadir initialised at
            # image build time, resident twice at boot.
            mem: 2048
            # `sh /start.sh`: mariadbd, unlike mysqld, refuses to start
            # when libkrun's appended words reach its argv ("Too many
            # arguments (first extra is 'earlycon=...')"), so the script
            # absorbs them and exec()s the server. The rest of the
            # configuration is /etc/my.cnf inside the image.
            argv: /bin/sh /start.sh
            port: 3306
            # The same real-query check as unikraft-mysql; MariaDB answers the
            # same client protocol, same credentials (root/unikraft).
            probe: mysql
            expect: "unikraft-on-bsdkrun"
            # Verified end to end on arm64/macOS -- it took four fixes, each
            # hidden behind the last: an Aria recovery that wedges the boot,
            # an argv the server refuses, a transaction-coordinator log it
            # cannot mmap, and a TLS certificate minted in 1970 by a guest
            # with no clock. See examples/unikraft-mariadb/README.md. x86_64
            # has never been run, so this job is the test; non-strict until
            # it passes.
            strict: false
          - example: unikraft-mongodb
            kernel: mongodb_fc-x86_64
            # mongod alone is ~150 MiB, resident twice at boot, plus the
            # WiredTiger cache (bounded to 256 MiB in start.sh).
            mem: 2048
            # `sh /start.sh`: mongod's option parser rejects the positional
            # junk libkrun appends to argv, so the script absorbs it and
            # exec()s mongod (--bind_ip_all --nounixsocket, bounded cache).
            argv: /bin/sh /start.sh
            port: 27017
            # An upsert and a read-back through WiredTiger, not a ping.
            probe: mongo
            expect: "unikraft-on-bsdkrun"
            # Verified end to end on arm64/macOS. It took five fixes --
            # a CPU topology and /proc entries baked into the image, 1 MiB
            # stacks, no WiredTiger journal pre-allocation, and two kernel
            # signal fixes in library/unikraft-base/patches, the second of
            # which (sigaltstack(SS_DISABLE) returning ENOMEM) is what had
            # been aborting the server in a pool thread here too. That fix
            # is not architecture specific, so this run is the test.
            # See examples/unikraft-mongodb/README.md.
            strict: false
          - example: unikraft-php
            kernel: php_fc-x86_64
            pack: true
            placeholder: php
            # php-cli plus its extensions is ~30 MiB of rootfs.
            mem: 512
            # server.php ignores the extra argv words libkrun appends, so no
            # trampoline script.
            argv: /usr/local/bin/php /usr/src/server.php
            port: 8080
            expect: "Hello, World!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-ruby
            kernel: ruby_fc-x86_64
            pack: true
            placeholder: ruby
            # ruby plus its stdlib is ~60 MiB of rootfs.
            mem: 512
            # server.rb ignores the extra ARGV words libkrun appends, so no
            # trampoline script.
            argv: /usr/bin/ruby /src/server.rb
            port: 8080
            expect: "Hello, World!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-python
            kernel: python_fc-x86_64
            pack: true
            placeholder: python
            # CPython's prefix is ~90 MiB of rootfs, resident twice at boot.
            mem: 1024
            argv: /opt/python/bin/python3 -u /src/main.py
            port: 8080
            expect: "Hello from Python on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-haskell
            kernel: haskell_fc-x86_64
            pack: true
            placeholder: haskell
            mem: 512
            argv: /usr/bin/server
            port: 8080
            expect: "Hello from Haskell on Unikraft!"
            strict: false
          - example: unikraft-symfony
            kernel: php_fc-x86_64
            pack: true
            placeholder: php
            # php plus vendor/; the front controller is served by php -S.
            mem: 512
            argv: /usr/local/bin/php -S 0.0.0.0:8080 -t /usr/src/public /usr/src/public/index.php
            port: 8080
            expect: "Hello from Symfony on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-laravel
            kernel: php_fc-x86_64
            pack: true
            placeholder: php
            # The full framework plus its vendor tree.
            mem: 1024
            argv: /usr/local/bin/php -S 0.0.0.0:8080 -t /usr/src/public /usr/src/public/index.php
            port: 8080
            expect: "Hello from Laravel on Unikraft!"
            strict: false
          - example: unikraft-static
            kernel: static_fc-x86_64
            pack: true
            placeholder: static
            mem: 512
            argv: /usr/bin/caddy run --config /etc/caddy/Caddyfile
            port: 8080
            expect: "Hello from a static site on Unikraft!"
            strict: false
          - example: unikraft-crystal
            kernel: crystal_fc-x86_64
            pack: true
            placeholder: crystal
            mem: 512
            argv: /usr/bin/server
            port: 8080
            expect: "Hello from Crystal on Unikraft!"
            strict: false
          - example: unikraft-zig
            kernel: zig_fc-x86_64
            pack: true
            placeholder: zig
            mem: 512
            argv: /usr/bin/server
            port: 8080
            expect: "Hello from Zig on Unikraft!"
            strict: false
          - example: unikraft-java
            kernel: java_fc-x86_64
            pack: true
            placeholder: java
            # A jlink'd JRE plus the shaded jar.
            mem: 1024
            argv: /opt/jre/bin/java -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:-UseContainerSupport -XX:-UsePerfData -XX:TieredStopAtLevel=1 -Xmx256m -jar /usr/src/server.jar
            port: 8080
            expect: "Hello from Java on Unikraft!"
            # Never run on either architecture yet: this job is the test.
            strict: false
          - example: unikraft-scala
            kernel: scala_fc-x86_64
            pack: true
            placeholder: scala
            mem: 1024
            argv: /opt/jre/bin/java -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:-UseContainerSupport -XX:-UsePerfData -XX:TieredStopAtLevel=1 -Xmx256m -jar /usr/src/server.jar
            port: 8080
            expect: "Hello from Scala on Unikraft!"
            strict: false
          - example: unikraft-swift
            kernel: swift_fc-x86_64
            pack: true
            placeholder: swift
            mem: 512
            argv: /usr/bin/server
            port: 8080
            expect: "Hello from Swift on Unikraft!"
            strict: false
          - example: unikraft-dotnet
            kernel: dotnet_fc-x86_64
            pack: true
            placeholder: dotnet
            # The self-contained runtime ships with the app.
            mem: 1024
            argv: /usr/src/app/server
            port: 8080
            expect: "Hello from C# on Unikraft!"
            strict: false
          - example: unikraft-rails
            kernel: rails_fc-x86_64
            # ruby, the gem bundle, the generated app and zoneinfo, resident
            # twice at boot, plus Rails' own appetite.
            mem: 2048
            # boot.rb, not `bin/rails server`: Thor would abort on the argv
            # words libkrun appends, so the entrypoint clears ARGV and invokes
            # the server command programmatically. See
            # examples/unikraft-rails/README.md.
            argv: /usr/bin/ruby /app/boot.rb
            port: 3000
            expect: "Hello, World!"
            # Never run on x86_64; this job is the test. Non-strict until it
            # passes.
            strict: false
          - example: unikraft-caddy
            kernel: caddy_fc-x86_64
            # A statically-linked Go binary; ~512 covers it comfortably.
            mem: 512
            # No trampoline: caddy's cobra-based CLI tolerates the words
            # libkrun appends past the kernel cmdline's `--` stop, unlike
            # nginx/apache below. See examples/unikraft-caddy/README.md.
            argv: /usr/bin/caddy run --config /etc/caddy/Caddyfile
            port: 2015
            expect: "Hello, world!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-nginx
            kernel: nginx_fc-x86_64
            mem: 512
            # `sh /start.sh`: nginx's getopt-based argv parser rejects the
            # positional junk libkrun appends ("invalid option"), so the
            # script absorbs it and exec()s nginx with a clean argv, the same
            # pattern as unikraft-redis. See examples/unikraft-nginx/README.md.
            argv: /bin/sh /start.sh
            port: 8080
            expect: "Welcome to nginx!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
          - example: unikraft-apache
            kernel: apache_fc-x86_64
            mem: 512
            # `sh /start.sh`: same argv-trampoline reason as nginx.
            argv: /bin/sh /start.sh
            port: 8080
            expect: "Hello from Apache on Unikraft!"
            # Known-failing, not merely unverified: apache2's unconditional
            # PID-file write calls chmod()/fchmodat(), which this kernel does
            # not implement (ENOSYS) -- the same gap
            # examples/unikraft-postgres/README.md already documents for Unix
            # sockets. apache2 exits before it ever binds a listener, on both
            # architectures, until that gap is patched. See
            # examples/unikraft-apache/README.md. Left non-strict so this
            # documents the failure instead of blocking the workflow; flip to
            # strict once library/unikraft-base implements chmod().
            strict: false
          - example: unikraft-wasmer
            kernel: wasmer_fc-x86_64
            # A native Rust host plus a JIT (wasmer singlepass) compiling a
            # tiny wasm module on every request; 512 was enough on arm64.
            mem: 512
            # No trampoline: the host binary's own argv parsing ignores
            # anything libkrun appends -- see
            # examples/unikraft-wasmer/README.md.
            argv: /server
            port: 8080
            expect: "Hello from Wasmer on Unikraft!"
            # Verified end to end on arm64/macOS; x86_64 has never been run,
            # so this job is the test. Non-strict until it passes.
            strict: false
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      - name: Install build deps (bsdkrun, libkrun/libkrunfw, and Unikraft)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils python3 \
            python3-pyelftools pkg-config patchelf patch cpio kmod rsync zstd \
            flex bison bc libelf-dev libssl-dev libncurses-dev libyaml-dev \
            uuid-runtime unzip wget clang libclang-dev llvm-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # --port forwards a host port into the guest, which is user-mode
      # networking; without gvproxy on PATH the machine refuses to start.
      - name: Install gvproxy (user-mode networking)
        run: |
          set -eux
          sudo curl -fL -o /usr/local/bin/gvproxy \
            https://github.com/containers/gvisor-tap-vsock/releases/latest/download/gvproxy-linux-amd64
          sudo chmod +x /usr/local/bin/gvproxy
          gvproxy --help >/dev/null 2>&1 || which gvproxy

      # Same cache key as e2e-linux.yml and e2e-unikraft.yml on purpose: a hit
      # from any of them saves the ~15-20 min libkrunfw kernel compile.
      - name: Restore libkrun build
        id: libkrun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v16

      - name: Build libkrun (cache miss)
        if: steps.libkrun-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 -b v5.5.0 https://github.com/containers/libkrunfw
          ( cd libkrunfw && make -j"$(nproc)" && sudo make install )
          git clone --depth 1 -b feat/pvh-boot https://github.com/tsirysndr/libkrun
          ( cd libkrun && make -j"$(nproc)" BLK=1 NET=1 )

      - name: Save libkrun build
        if: steps.libkrun-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            libkrunfw
            libkrun
          key: libkrun-build-x86_64-pvh-v16

      - name: Install libkrun
        run: |
          set -eux
          ( cd libkrunfw && sudo make install )
          ( cd libkrun && sudo make install BLK=1 NET=1 )
          echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/libkrun.conf
          sudo ldconfig

      # Only needed for the `pack: true` examples, but the binary is built
      # once for all of them: core/build.rs compiles pack/ and embeds it, so
      # without Go the `bsdkrun pack` subcommand would not exist at all.
      - uses: actions/setup-go@v5
        with:
          go-version-file: pack/go.mod

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build bsdkrun
        run: cargo build --release

      - name: Install kraft
        run: |
          set -eux
          curl -fsSLo /tmp/kraft.deb \
            "https://github.com/unikraft/kraftkit/releases/download/v${KRAFT_VERSION}/kraftkit_${KRAFT_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/kraft.deb
          kraft version
        env:
          KRAFT_VERSION: 0.12.15

      # build.sh runs the kraft half natively on Linux (no container), and
      # builds the rootfs with buildx for the target arch. Here host and target
      # are both x86_64, so no emulation is involved.
      # `pack: true` examples ship no Dockerfile/Kraftfile of their own —
      # `bsdkrun pack` detects the project, builds the rootfs with BuildKit
      # and generates the Kraftfile. The rest still build the checked-in
      # Kraftfile through their own build.sh.
      # BuildKit's cache lives inside the buildkitd container, which is new
      # every job — so without persisting it here, every run rebuilds every
      # base image and every build step from cold. Keyed per example so one
      # entry cannot be clobbered by another's; restore-keys lets a changed
      # provider still start from the last good cache rather than nothing.
      - name: Cache the pack build (BuildKit)
        if: ${{ matrix.pack }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/bsdkrun/build-cache
          key: pack-buildkit-x86_64-${{ matrix.example }}-${{ hashFiles('pack/internal/providers/**') }}
          restore-keys: |
            pack-buildkit-x86_64-${{ matrix.example }}-
            pack-buildkit-x86_64-

      - name: Build the example (bsdkrun pack)
        if: ${{ matrix.pack }}
        run: |
          set -eux
          ./target/release/bsdkrun pack examples/${{ matrix.example }} \
            --target x86_64 --plain
          ls -l examples/${{ matrix.example }}/.unikraft/build/${{ matrix.kernel }}
        env:
          KRAFTKIT_NO_PROMPT: "1"
          BSDKRUN_PACK_BUILD_CACHE: /home/runner/.cache/bsdkrun/build-cache

      - name: Build the example (build.sh)
        if: ${{ !matrix.pack }}
        run: |
          set -eux
          ./examples/${{ matrix.example }}/build.sh x86_64
          ls -l examples/${{ matrix.example }}/.unikraft/build/${{ matrix.kernel }}
        env:
          KRAFTKIT_NO_PROMPT: "1"

      # The patches are what make the elfloader build work; if apply.sh silently
      # did nothing, the driver would be missing and entropy would be gone.
      - name: Assert the patches were applied
        run: |
          set -eux
          cfg=examples/${{ matrix.example }}/.config.${{ matrix.kernel }}
          grep -q '^CONFIG_LIBVIRTIO_RNG=y' "$cfg"
          grep -q '^CONFIG_FPSIMD=y' "$cfg" || true # arm64-only symbol
          test -f examples/${{ matrix.example }}/.unikraft/unikraft/drivers/virtio/rng/virtio_rng.c
          echo "--- virtio-mmio cmdline device budget ---"
          grep -E '^CONFIG_(LIBVIRTIO_MMIO|VIRTIO_MMIO_MAX_DEV_CMDLINE|VIRTIO_MMIO_LINUX_COMPAT_CMDLINE)' "$cfg"
          # Preemption is not optional for this example: mysqld busy-waits for
          # a thread during InnoDB startup and a cooperative scheduler can
          # never run it. A Kraftfile kconfig line that silently fails to
          # apply would look exactly like the original hang, so assert it.
          if [ "${{ matrix.probe }}" = mysql ]; then
            grep -q '^CONFIG_UKPLAT_PREEMPT=y' "$cfg"
            grep -q '^CONFIG_LIBPOSIX_PROCESS_MAX_PID=1024' "$cfg"
          fi

      - name: Install a MySQL client
        if: ${{ matrix.probe == 'mysql' }}
        run: |
          set -eux
          command -v mysql \
            || sudo apt-get install -y --no-install-recommends mysql-client

      - name: Install a PostgreSQL client
        if: ${{ matrix.probe == 'postgres' }}
        run: |
          set -eux
          command -v psql \
            || sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install a Redis client
        if: ${{ matrix.probe == 'redis' }}
        run: |
          set -eux
          command -v redis-cli \
            || sudo apt-get install -y --no-install-recommends redis-tools

      # mongosh comes from MongoDB's download server: Ubuntu dropped its
      # mongodb packages when the license changed, so there is nothing to apt
      # install from the stock repos.
      - name: Install a MongoDB client (mongosh)
        if: ${{ matrix.probe == 'mongo' }}
        run: |
          set -eux
          command -v mongosh && exit 0
          curl -fsSL -o /tmp/mongosh.deb \
            https://downloads.mongodb.com/compass/mongodb-mongosh_2.3.8_amd64.deb
          sudo dpkg -i /tmp/mongosh.deb
          mongosh --version

      # `<argv0> -- <application argv>`: everything before `--` is parsed as
      # kernel library parameters and the first word is skipped (Unikraft treats
      # it as the program name), so the placeholder is required.
      - name: e2e — boot the unikernel
        run: |
          set -eux
          ./target/release/bsdkrun unikraft -d \
            --name ${{ matrix.example }} \
            --mem ${{ matrix.mem }} \
            --port ${{ matrix.port }}:${{ matrix.port }} \
            --cmdline "${{ matrix.placeholder || 'elfloader' }} -- ${{ matrix.argv }}" \
            examples/${{ matrix.example }} | tee id.txt
          OUT=uk-${{ matrix.example }}.out
          # Wait for the boot banner rather than sleeping a fixed 20s: a
          # unikernel reaches it in about a second, and the HTTP check below
          # already retries for the application itself. Polling to a cap
          # means the quick examples stop waiting immediately while the
          # heavy ones (mysql, postgres, mongodb, mariadb) still get more
          # headroom than the old fixed sleep gave them.
          for i in $(seq 1 60); do
            ./target/release/bsdkrun logs "$(cat id.txt)" > "$OUT" 2>/dev/null || true
            grep -q "Powered by Unikraft" "$OUT" && break
            sleep 1
          done
          ./target/release/bsdkrun ps -a
          ./target/release/bsdkrun logs "$(cat id.txt)" | tee uk-${{ matrix.example }}.out
          # bsdkrun's own log records the assembled kernel command line. On
          # x86_64 that is the only place the NIC is advertised to the guest
          # (`virtio_mmio.device=`), so it is what to read when no interface
          # shows up.
          cp -v "$HOME/.local/state/bsdkrun/machines/$(cat id.txt)/bsdkrun.log" \
            uk-${{ matrix.example }}-boot.out || true

      # Boot milestones, asserted in order so a failure names the earliest
      # stage that broke rather than a symptom further down.
      - name: e2e — kernel came up
        run: |
          set -eux
          out=uk-${{ matrix.example }}.out
          echo "::group::guest console"
          cat "$out" || true
          echo "::endgroup::"
          grep -q "Powered by Unikraft" "$out"

      # A register dump is only actionable with symbols, and only this job has
      # everything needed to resolve them: the kernel's .dbg for kernel-range
      # addresses, and the exported rootfs plus the loader's "loaded to" lines
      # for application-range ones (flip CONFIG_APPELFLOADER_DEBUG to 'y' in
      # the example's Kraftfile to get those). Print names instead of hex,
      # right in the log where the crash is. This is how the vfork TLS bug
      # (patch 22) was pinned to musl's pthread_exit+0x17f.
      - name: Symbolicate a guest crash
        if: ${{ always() }}
        run: |
          set -eu
          out=uk-${{ matrix.example }}.out
          grep -aq "Unikraft Crash" "$out" 2>/dev/null || exit 0
          echo "::group::crash symbolication"
          python3 .github/scripts/symbolicate-unikraft-crash.py \
            "$out" \
            examples/${{ matrix.example }}/.unikraft/build/${{ matrix.kernel }}.dbg \
            examples/${{ matrix.example }}/.rootfs-x86_64 \
            || true
          echo "::endgroup::"

      - name: e2e — networking and entropy
        run: |
          set -eu
          out=uk-${{ matrix.example }}.out
          boot=uk-${{ matrix.example }}-boot.out
          echo "::group::bsdkrun boot log (kernel cmdline, device setup)"
          cat "$boot" 2>/dev/null || echo "(no boot log)"
          echo "::endgroup::"
          # Order matters: assert the interface first. Without it lwip never
          # starts, so the entropy grep would pass vacuously.
          #
          # On x86_64 there is no device tree, so the guest learns about its
          # NIC solely from the `virtio_mmio.device=` parameters libkrun
          # appends. Getting an address here is therefore also a test of the
          # virtio-mmio probe fix in library/unikraft-base/patches.
          grep -q "Set IPv4 address" "$out"
          ! grep -q "Could not obtain randomness" "$out"

      # The payoff assertion: the guest ran the application and it answered over
      # the forwarded port. `continue-on-error` applies only to examples marked
      # `strict: false` in the matrix -- see the top of this file for what that
      # means and when to clear it.
      #
      # `probe: mysql` selects a SQL check instead of an HTTP one, for the
      # example that does not speak HTTP. The client comes from the runner
      # image, which ships one.
      #
      # The retry loop matters: mysqld accepts connections a moment before it
      # finishes opening the datadir, so the first attempts can legitimately be
      # refused.
      - name: e2e — server answers
        id: http
        continue-on-error: ${{ !matrix.strict }}
        run: |
          set -eu
          for i in $(seq 1 45); do
            if [ "${{ matrix.probe }}" = mysql ]; then
              if mysql --protocol=TCP -h 127.0.0.1 -P ${{ matrix.port }} \
                       --ssl-mode=DISABLED -u root -punikraft \
                       -e "CREATE DATABASE IF NOT EXISTS e2e;
                           USE e2e;
                           CREATE TABLE IF NOT EXISTS t (
                               id INT PRIMARY KEY, name VARCHAR(64));
                           REPLACE INTO t VALUES (1, 'unikraft-on-bsdkrun');
                           SELECT name FROM t WHERE id = 1;" \
                       > body.txt 2>probe-err.txt; then
                break
              fi
            elif [ "${{ matrix.probe }}" = postgres ]; then
              # No password: the cluster was initialised with --auth=trust,
              # because nothing in the guest can reach the server except
              # through the forwarded port.
              if psql -h 127.0.0.1 -p ${{ matrix.port }} -U postgres \
                      -v ON_ERROR_STOP=1 --no-psqlrc -t \
                      -c "CREATE TABLE IF NOT EXISTS t (
                              id INT PRIMARY KEY, name TEXT);
                          INSERT INTO t VALUES (1, 'unikraft-on-bsdkrun')
                              ON CONFLICT (id) DO UPDATE SET name = excluded.name;
                          SELECT name FROM t WHERE id = 1;" \
                      postgres > body.txt 2>probe-err.txt; then
                break
              fi
            elif [ "${{ matrix.probe }}" = redis ]; then
              # SET then GET: a green run means the server parsed RESP and
              # round-tripped a value, not merely that it opened a socket.
              # (redis-cli exits 0 even when the server answers with an
              # error, so the grep is part of the loop condition, not just
              # the final assertion.)
              if redis-cli -h 127.0.0.1 -p ${{ matrix.port }} \
                     SET e2e unikraft-on-bsdkrun > /dev/null 2>probe-err.txt \
                 && redis-cli -h 127.0.0.1 -p ${{ matrix.port }} \
                     GET e2e > body.txt 2>>probe-err.txt \
                 && grep -q "${{ matrix.expect }}" body.txt; then
                break
              fi
            elif [ "${{ matrix.probe }}" = mongo ]; then
              # An upsert and a read-back, so a green run means WiredTiger
              # accepted a write and served it back, not merely that mongod
              # opened a socket.
              if mongosh --host 127.0.0.1 --port ${{ matrix.port }} --quiet \
                     --eval 'db.t.replaceOne({_id: 1},
                                             {_id: 1, name: "unikraft-on-bsdkrun"},
                                             {upsert: true});
                             print(db.t.findOne({_id: 1}).name)' \
                     e2e > body.txt 2>probe-err.txt; then
                break
              fi
            elif curl -fsS --max-time 5 "http://127.0.0.1:${{ matrix.port }}/" -o body.txt; then
              break
            fi
            sleep 2
          done
          test -s body.txt || {
            echo "no response from the guest"
            cat probe-err.txt 2>/dev/null || true
            exit 1
          }
          cat body.txt
          grep -a -q "${{ matrix.expect }}" body.txt

      # Make a non-strict result visible in the job summary rather than leaving
      # it buried in a green tick.
      - name: Report non-strict outcome
        if: ${{ !matrix.strict }}
        run: |
          set -eu
          if [ "${{ steps.http.outcome }}" = success ]; then
            echo "### ${{ matrix.example }}: HTTP check PASSED on x86_64" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "It is no longer known-failing here. Set \`strict: true\` for this" \
                 "matrix entry so a regression fails the job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.example }}: HTTP check failed (known, not fatal)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See examples/${{ matrix.example }}/README.md. The console log is" \
                 "attached as an artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tear down
        if: always()
        run: |
          set -eux
          ./target/release/bsdkrun rm -f "$(cat id.txt)" || true

      - name: Upload console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unikraft-${{ matrix.example }}-console
          path: uk-*.out
          if-no-files-found: ignore
