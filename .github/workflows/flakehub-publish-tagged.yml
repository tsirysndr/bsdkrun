name: "Publish tags to FlakeHub"
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"
      - uses: fluentci-io/setup-fluentci@next
      - name: Set up Determinate Nix
        shell: bash
        run: fluentci run setup-determinate-nix setup --sudo true --trusted-users runner | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      - name: Set up Cachix
        shell: bash
        run: fluentci run setup-cachix setup --cache bsdkrun | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      - name: Set up Rust (stable)
        shell: bash
        run: fluentci run setup-rust setup --toolchain stable | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      # flakehub-push through FluentCI: the setup module installs the tool and
      # the nix-publish module runs it with GitHub's OIDC token (hence the
      # id-token permission above). The tag is the pushed ref, or the one
      # given to a manual run.
      # The module looks up flakehub-push's release with curl against
      # api.github.com, which rate-limits the shared runner's anonymous
      # requests (a plain 403). curl reads a .curlrc from CURL_HOME, so the
      # token goes in through one, never on a command line.
      - name: Set up flakehub-push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          curl_home=$(mktemp -d "$RUNNER_TEMP/flakehub-setup-curl.XXXXXXXX")
          trap 'rm -rf "$curl_home"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$curl_home/.curlrc"
          CURL_HOME="$curl_home" fluentci run setup-flakehub-push setup | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      # flakehub-push exchanges the workflow token for FlakeHub's OIDC
      # identity and records the revision it publishes; Nix itself fetches
      # the flake's GitHub inputs and takes its token from NIX_CONFIG.
      - name: Publish to FlakeHub
        shell: bash
        env:
          FLAKEHUB_PUSH_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NIX_CONFIG: |
            access-tokens = github.com=${{ github.token }}
        run: |
          set -euo pipefail
          export FLAKEHUB_PUSH_REV
          FLAKEHUB_PUSH_REV=$(git rev-parse HEAD)
          fluentci run nix-publish flakehub \
            --run-dir "$RUNNER_TEMP/nix-publish-$GITHUB_RUN_ATTEMPT" \
            --name tsirysndr/bsdkrun \
            --version "${{ inputs.tag || github.ref_name }}" \
            --visibility public \
            --timeout-ms 2400000
