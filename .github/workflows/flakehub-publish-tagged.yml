name: "Publish tags to FlakeHub"
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true
jobs:
  flakehub-publish:
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"
      - uses: fluentci-io/setup-fluentci@next
      - name: Set up Determinate Nix
        shell: bash
        run: fluentci run setup-determinate-nix setup --sudo true --trusted-users runner | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      - name: Set up Cachix
        shell: bash
        run: fluentci run setup-cachix setup --cache bsdkrun | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      - name: Set up Rust (stable)
        shell: bash
        run: fluentci run setup-rust setup --toolchain stable | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      # flakehub-push through FluentCI: the setup module installs the tool and
      # the nix-publish module runs it with GitHub's OIDC token (hence the
      # id-token permission above). The tag is the pushed ref, or the one
      # given to a manual run.
      - name: Set up flakehub-push
        shell: bash
        run: fluentci run setup-flakehub-push setup | node "$GITHUB_WORKSPACE/.fluentci/github-env.mjs"
      - name: Publish to FlakeHub
        shell: bash
        run: >-
          fluentci run nix-publish flakehub
          --run-dir "$RUNNER_TEMP/nix-publish"
          --name tsirysndr/bsdkrun
          --version "${{ inputs.tag || github.ref_name }}"
          --visibility public
