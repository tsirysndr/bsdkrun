name: nix

# Build bsdkrun and bsdkrund through the Nix flake and run `nix flake check`
# (package builds + clippy + rustfmt). Linux links nixpkgs' libkrun; macOS links
# Homebrew's libkrun impurely (`--impure`) and re-signs with the hypervisor
# entitlement. No KVM needed, so it runs on the standard runners.

on:
  push:
    branches: [main, feat/linux-host]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: nix · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
            flags: ""
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
            flags: ""
          - arch: aarch64-darwin
            runner: macos-latest
            flags: "--impure" # links Homebrew libkrun via LIBKRUN_PREFIX
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: bsdkrun
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # macOS has no libkrun in nixpkgs — the flake links Homebrew's (impurely).
      - name: Install libkrun (macOS)
        if: runner.os == 'macOS'
        run: |
          brew tap libkrun/krun
          brew trust libkrun/krun || true
          brew install libkrun

      # Built on its own first, though `.#bsdkrun` would pull it in anyway: the
      # tender is C built by solo5's own configure/make, and a failure there is
      # far easier to read on its own than buried in a Rust build. The smoke
      # test is what proves the darwin signing worked — an unentitled tender
      # builds and installs fine and only fails at `hv_vm_create`.
      #
      # No submodule checkout is needed: the flake takes solo5 from a pinned
      # input rather than from library/solo5.
      - name: nix build (solo5 tender)
        run: nix build -L --out-link result-solo5 .#solo5-hvt

      - name: Smoke-test the solo5 tender
        run: ./result-solo5/bin/solo5-hvt --version

      # BSDKRUN_IMPURE=1 makes the flake import Homebrew's libkrun into the store
      # for the (impure) darwin build. On Linux it's inert: no --impure is passed,
      # so builtins.getEnv returns "" and the Linux path uses nixpkgs' libkrun.
      - name: nix build
        env:
          BSDKRUN_IMPURE: "1"
        run: nix build -L ${{ matrix.flags }} .#bsdkrun

      # The daemon takes the engine without its `boot` feature, so it still
      # links no libkrun and builds purely everywhere. Deliberately built
      # WITHOUT ${{ matrix.flags }}: on darwin that omits --impure, which keeps
      # this step an assertion that the daemon has no Homebrew dependency.
      - name: nix build (bsdkrund)
        run: nix build -L --out-link result-bsdkrund .#bsdkrund

      # The supervisor is the half that does link libkrun, so it is built like
      # the CLI — impurely on darwin.
      - name: nix build (bsdkrun-supervisor)
        env:
          BSDKRUN_IMPURE: "1"
        run: nix build -L ${{ matrix.flags }} --out-link result-supervisor .#bsdkrun-supervisor

      - name: Smoke-test bsdkrund
        run: ./result-bsdkrund/bin/bsdkrund --version

      - name: Smoke-test bsdkrun-supervisor
        run: ./result-supervisor/bin/bsdkrun-supervisor --version

      - name: nix flake check
        env:
          BSDKRUN_IMPURE: "1"
        run: nix flake check -L ${{ matrix.flags }}
