name: Release (FreeBSD amd64 image)

# FreeBSD's GENERIC kernel expects ACPI, which a firecracker-class PVH machine
# (like libkrun) doesn't provide — so it hangs in early platform init. FreeBSD
# ships a dedicated `FIRECRACKER` kernel config for exactly this: it drops ACPI,
# enumerates via the legacy MPTable, and has virtio-mmio + serial console built
# in with the hints a PVH direct boot (no loader) needs. We build that kernel
# from source and pair it with a minimal UFS rootfs (agent injected).
#
# Built natively in a FreeBSD amd64 VM (cross-platform-actions) — cross-version
# buildkernel is fragile, so the rootfs, src, and kernel are all the same
# release as the VM.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FreeBSD release to build (native in the same-version VM)"
        required: false
        default: "15.1"
        type: string
      release_tag:
        description: "Rolling release tag to publish the assets to"
        required: false
        default: "freebsd-amd64"
        type: string
      agent_url:
        description: "URL of the FreeBSD x86_64 agent to inject"
        required: false
        default: "https://github.com/tsirysndr/bsdkrun/releases/download/v0.2.0/bsdkrun-agent.freebsd-x86_64"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build FIRECRACKER kernel + rootfs (in FreeBSD VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start FreeBSD amd64 VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: "${{ inputs.version }}"
          architecture: x86-64
          shell: bash
          memory: 12G
          cpu_count: 4

      - name: Build FIRECRACKER kernel + UFS rootfs
        shell: cpa.sh {0}
        run: |
          set -eux
          VERSION="${{ inputs.version }}"
          AGENT_URL="${{ inputs.agent_url }}"
          WS="$(pwd)"
          mkdir -p "$WS/dist"
          fetch -o "$WS/bsdkrun-agent" "$AGENT_URL"
          chmod a+x "$WS/bsdkrun-agent"

          sudo env WS="$WS" VERSION="$VERSION" /bin/sh -eux <<'ROOTEOF'
          BASE="https://download.freebsd.org/releases/amd64/${VERSION}-RELEASE"
          WORK=/var/tmp/fbimg
          ROOT="$WORK/rootfs"
          rm -rf "$WORK"; mkdir -p "$ROOT"
          cd "$WORK"

          # 1. Minimal userland + the kernel source (for buildkernel FIRECRACKER).
          fetch -o base.txz "$BASE/base.txz"
          tar -xpf base.txz -C "$ROOT"
          fetch -o src.txz "$BASE/src.txz"
          tar -xpf src.txz -C /            # -> /usr/src

          # NB: FIRECRACKER's `machdep.disable_tsc_calibration=1` is left as-is.
          # Under libkrun the kernel can't derive the TSC frequency on its own
          # (no KVM tsc-freq CPUID leaf; AMD has no Intel TSC leaf; and PVH's
          # `xen_delay` calibration path faults on a Xen pvclock that KVM doesn't
          # provide). bsdkrun instead passes `machdep.tsc_freq` on the cmdline
          # (read from the host — KVM runs the guest TSC at the host rate), so
          # calibration is skipped either way. See freebsd_cmdline() in bsdkrun.

          # 2. Build the FIRECRACKER kernel (no ACPI, MPTable, virtio-mmio + serial
          #    console built in). -DNO_MODULES: the config is monolithic, so skip the
          #    (slow) module build. Dump the tail on failure.
          NJ="$(sysctl -n hw.ncpu)"
          if ! make -C /usr/src buildkernel KERNCONF=FIRECRACKER -DNO_MODULES -j"$NJ" \
                 > /tmp/buildkernel.log 2>&1; then
            echo "=== buildkernel FAILED (tail) ==="; tail -60 /tmp/buildkernel.log; exit 1
          fi
          make -C /usr/src installkernel KERNCONF=FIRECRACKER -DNO_MODULES DESTDIR="$ROOT"
          KERNEL="/usr/obj/usr/src/amd64.amd64/sys/FIRECRACKER/kernel"
          test -f "$KERNEL"

          # 3. Config: root on vtbd0, DHCP on vtnet0, serial console, agent.
          cat > "$ROOT/etc/rc.conf" <<'EOF'
          hostname="bsdkrun"
          ifconfig_vtnet0="DHCP"
          sshd_enable="NO"
          sendmail_enable="NONE"
          bsdkrun_agent_enable="YES"
          EOF
          cat > "$ROOT/etc/fstab" <<'EOF'
          /dev/vtbd0  /  ufs  rw  1  1
          EOF
          # Passwordless root on the (secure) serial console for debugging.
          awk -F: 'BEGIN{OFS=":"} $1=="root"{$2=""} {print}' \
            "$ROOT/etc/master.passwd" > "$ROOT/etc/master.passwd.new"
          mv "$ROOT/etc/master.passwd.new" "$ROOT/etc/master.passwd"
          chmod 600 "$ROOT/etc/master.passwd"
          pwd_mkdb -d "$ROOT/etc" -p "$ROOT/etc/master.passwd"

          # 4. Agent + rc.d autostart.
          mkdir -p "$ROOT/usr/local/sbin" "$ROOT/usr/local/etc/rc.d"
          install -m 755 "$WS/bsdkrun-agent" "$ROOT/usr/local/sbin/bsdkrun-agent"
          cat > "$ROOT/usr/local/etc/rc.d/bsdkrun_agent" <<'EOF'
          #!/bin/sh
          #
          # PROVIDE: bsdkrun_agent
          # REQUIRE: NETWORKING
          # KEYWORD: shutdown

          . /etc/rc.subr

          name="bsdkrun_agent"
          rcvar="bsdkrun_agent_enable"

          load_rc_config $name

          : ${bsdkrun_agent_enable:="NO"}
          : ${bsdkrun_agent_program:="/usr/local/sbin/bsdkrun-agent"}

          pidfile="/var/run/${name}.pid"
          command="/usr/sbin/daemon"
          command_args="-f -P ${pidfile} -r ${bsdkrun_agent_program}"

          run_rc_command "$1"
          EOF
          chmod 555 "$ROOT/usr/local/etc/rc.d/bsdkrun_agent"

          # 5. Build the UFS image + stage both RAW assets into the synced dist/.
          #    Compression is done on the host afterwards — gzip -9 of a 2 GB image
          #    is painfully slow inside the VM. (FIRECRACKER kernel = the PVH kernel.)
          makefs -t ffs -s 2g -o version=2 "$WS/dist/freebsd-amd64-root.img" "$ROOT"
          cp "$KERNEL" "$WS/dist/freebsd-kernel-amd64"
          chmod 644 "$WS/dist"/*
          ls -lh "$WS/dist"
          ROOTEOF

      - name: Compress on the host (native — fast)
        run: |
          set -eux
          # The raw image + kernel synced back from the VM; gzip them here.
          gzip -9 -f dist/freebsd-amd64-root.img   # -> dist/freebsd-amd64-root.img.gz
          gzip -9 -f dist/freebsd-kernel-amd64     # -> dist/freebsd-kernel-amd64.gz
          ls -lh dist

      - name: Checksums
        run: |
          set -eux
          cd dist
          for f in *.gz; do sha256sum "$f" > "$f.sha256"; done
          ls -lh

      - name: Publish to the rolling release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eux
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "FreeBSD amd64 (PVH FIRECRACKER kernel + rootfs + bsdkrun agent)" \
              --notes "Minimal FreeBSD amd64 UFS rootfs (agent injected, rc.d autostart) + the FIRECRACKER kernel built from source (no ACPI, MPTable, virtio-mmio + serial built in) to PVH-direct-boot under the tsirysndr/libkrun feat/pvh-boot fork. Rebuilt by the release-freebsd-amd64-image workflow."
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
