name: Release (NetBSD agent)

# zig ships no NetBSD libc, so the NetBSD guest agent can't be cross-compiled
# from macOS like the Linux/FreeBSD ones. It's built natively inside a NetBSD
# aarch64 VM under emulation, which is far too slow to sit in the tag-release
# path — so this is a manual, on-demand workflow. Run it for a tag whenever you
# want the NetBSD binary; it attaches to that tag's existing GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the NetBSD agent to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: netbsd-${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            slug: aarch64
          - arch: x86-64
            slug: x86_64
    steps:
      - name: Checkout
        # Deliberately no `ref:` — build the CURRENT branch's agent; the `tag`
        # input is only the release to attach to. (Building the tag's code
        # silently shipped stale agents: this matrix also builds x86_64 and
        # once overwrote a fresh amd64 agent with the tag's pre-CLI one.)
        uses: actions/checkout@v4

      - name: Start NetBSD ${{ matrix.slug }} VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: netbsd
          version: "10.1"
          architecture: ${{ matrix.arch }}
          shell: bash
          memory: 8G
          cpu_count: 4

      - name: Build the agent in the VM
        shell: cpa.sh {0}
        run: |
          set -euo pipefail
          # Point pkgin at the HTTPS CDN — the VM's default ftp mirror is very slow.
          echo "https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/${{ matrix.slug }}/10.1/All" \
            | sudo tee /usr/pkg/etc/pkgin/repositories.conf
          sudo pkgin -y update
          sudo pkgin -y install rust
          # Keep target/ out of the workspace so it isn't synced back to the host.
          export CARGO_TARGET_DIR="$HOME/build"
          cd agent
          cargo build --release --locked
          mkdir -p ../dist
          cp "$CARGO_TARGET_DIR/release/bsdkrun-agent" ../dist/bsdkrun-agent.netbsd-${{ matrix.slug }}

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 bsdkrun-agent.netbsd-${{ matrix.slug }} > bsdkrun-agent.netbsd-${{ matrix.slug }}.sha256
          ls -lh .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbsd-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  upload:
    name: Attach to GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
