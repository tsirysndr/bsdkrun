name: Release (NetBSD amd64 image)

# NetBSD publishes no ready-to-boot amd64 disk image (only arm64/evbarm ships a
# `gzimg`), so bsdkrun builds its own: an FFS rootfs made from the amd64 `sets`
# with `makefs`, plus the matching `MICROVM` kernel (a PVH ELF libkrun boots the
# same way it boots the Linux vmlinux). Both are published to a rolling release
# tag the client downloads (see `NETBSD_AMD64_BASE` in src/fetch.rs).
#
# `makefs` is a NetBSD tool, so the image is assembled inside a NetBSD VM (the
# same cross-platform-actions mechanism the guest-agent workflow uses). The sets
# and the kernel are pulled from ONE daily-HEAD snapshot so the kernel's /stand
# modules match the userland. MICROVM lives only in NetBSD-current today. The
# prebuilt amd64 agent is downloaded and injected (no in-VM rust build).

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "NetBSD-daily HEAD snapshot dir (e.g. 20260731194610Z, or 'latest')"
        required: false
        default: "latest"
        type: string
      release_tag:
        description: "Rolling release tag to publish the assets to"
        required: false
        default: "netbsd-amd64"
        type: string
      agent_url:
        description: "URL of the NetBSD x86_64 agent to inject"
        required: false
        default: "https://github.com/tsirysndr/bsdkrun/releases/download/v0.4.0/bsdkrun-agent.netbsd-x86_64"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build image (in NetBSD VM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start NetBSD x86_64 VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: netbsd
          version: "10.1"
          architecture: x86-64
          shell: bash
          memory: 8G
          cpu_count: 4

      - name: Build the FFS rootfs + stage the MICROVM kernel
        shell: cpa.sh {0}
        run: |
          set -eux
          export PATH="/usr/pkg/bin:$PATH"
          # NOTE: the script runs inside the NetBSD VM, which does NOT inherit the
          # host runner's env, so `env:` vars are invisible here. Interpolate the
          # workflow inputs into the script text directly instead.
          AGENT_URL="${{ inputs.agent_url }}"
          WS="$(pwd)"                       # synced workspace (checkout + artifacts)
          mkdir -p "$WS/dist"

          # 0. Point pkgin at the HTTPS CDN (the VM's default ftp mirror is very
          #    slow), install curl + tailscale, and download the prebuilt amd64
          #    agent to inject. tailscale is installed into the build VM (same arch
          #    as the target) so its binaries can be copied straight into the rootfs.
          echo 'https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.1/All' \
            | sudo tee /usr/pkg/etc/pkgin/repositories.conf
          sudo pkgin -y update
          sudo pkgin -y install curl tailscale
          AGENT_BIN="$WS/bsdkrun-agent"
          curl -fL -o "$AGENT_BIN" "$AGENT_URL"
          chmod a+x "$AGENT_BIN"

          # 1-5. Assemble the rootfs AS ROOT. This matters: `tar -xp` only restores
          #      the sets' root ownership + setuid bits when run as root; MAKEDEV
          #      needs root to mknod the /dev nodes the guest boots from (the sets
          #      ship none); and makefs must run as root to preserve all of that.
          sudo env WS="$WS" AGENT_BIN="$AGENT_BIN" /bin/sh -eux <<'ROOTEOF'
          export PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/pkg/bin
          BASEURL="https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.0/amd64/binary"
          WORK=/var/tmp/nbimg
          ROOT="$WORK/rootfs"
          rm -rf "$WORK"; mkdir -p "$ROOT"
          cd "$WORK"

          # Minimal sets + the MICROVM kernel, all from one snapshot (so the
          # kernel's /stand modules match the userland). HTTPS via curl.
          for s in base etc; do
            curl -fL -o "$s.tar.xz" "$BASEURL/sets/$s.tar.xz"
          done
          curl -fL -o netbsd-MICROVM.gz "$BASEURL/kernel/netbsd-MICROVM.gz"

          # Populate the rootfs (root -> correct ownership + setuid bits; NetBSD
          # tar autodetects xz).
          for s in base etc; do
            tar -xpf "$s.tar.xz" -C "$ROOT"
          done

          # Device nodes: the sets ship none, so the guest would have no
          # /dev/console or /dev/ld0a to boot from. Create them with the target's
          # own MAKEDEV (needs root for mknod).
          ( cd "$ROOT/dev" && sh ./MAKEDEV all )

          # Minimal config: DHCP networking, no swap, serial-console root login.
          cat > "$ROOT/etc/rc.conf" <<'EOF'
          rc_configured=YES
          hostname=bsdkrun
          dhcpcd=YES
          dhcpcd_flags="-b"
          no_swap=YES
          savecore=NO
          sshd=NO
          # Tailscale baked in (rc.d/tailscaled below). Userspace-networking so the
          # daemon starts cleanly without a TUN device in the MICROVM kernel; join a
          # tailnet with `tailscale up --authkey ...`.
          tailscaled=YES
          tailscaled_flags="--tun=userspace-networking"
          EOF

          # amd64 image is a bare makefs FFS on a virtio-blk disk -> root is ld0a.
          cat > "$ROOT/etc/fstab" <<'EOF'
          /dev/ld0a  /         ffs    rw  1 1
          ptyfs      /dev/pts  ptyfs  rw  0 0
          kernfs     /kern     kernfs rw  0 0
          EOF

          # MICROVM has no framebuffer; its console is the serial line (com0), which
          # NetBSD exposes as the `console` tty. Enable root login there, disable the
          # wscons ttyE* entries. (NetBSD sed -i is fiddly; filter via awk instead.)
          awk '{
            if ($1=="console") print "console \"/usr/libexec/getty default\" vt100 on secure";
            else if ($1 ~ /^ttyE/) print "#" $0;
            else print
          }' "$ROOT/etc/ttys" > "$ROOT/etc/ttys.new"
          mv "$ROOT/etc/ttys.new" "$ROOT/etc/ttys"

          # Passwordless root on the (secure) console — a dev microVM, not exposed.
          awk -F: 'BEGIN{OFS=":"} $1=="root"{$2=""} {print}' \
            "$ROOT/etc/master.passwd" > "$ROOT/etc/master.passwd.new"
          mv "$ROOT/etc/master.passwd.new" "$ROOT/etc/master.passwd"
          chmod 600 "$ROOT/etc/master.passwd"
          # pwd_mkdb -d is the ROOT dir (it appends /etc itself), so pass $ROOT.
          pwd_mkdb -d "$ROOT" -p "$ROOT/etc/master.passwd"

          # Bake in the guest agent so `bsdkrun exec` works out of the box, started
          # at boot via rc.d (NetBSD has no daemon(8), so it tracks the pid itself).
          mkdir -p "$ROOT/usr/local/sbin"
          install -m 755 "$AGENT_BIN" "$ROOT/usr/local/sbin/bsdkrun-agent"
          cat > "$ROOT/etc/rc.d/bsdkrun_agent" <<'EOF'
          #!/bin/sh
          #
          # PROVIDE: bsdkrun_agent
          # REQUIRE: NETWORKING

          . /etc/rc.subr

          name="bsdkrun_agent"
          rcvar=$name
          command="/usr/local/sbin/bsdkrun-agent"
          pidfile="/var/run/${name}.pid"

          start_cmd="agent_start"
          stop_cmd="agent_stop"

          agent_start()
          {
          	echo "Starting ${name}."
          	${command} &
          	echo $! > ${pidfile}
          }

          agent_stop()
          {
          	if [ -f ${pidfile} ]; then
          		kill "$(cat ${pidfile})" 2>/dev/null && rm -f ${pidfile}
          	fi
          }

          load_rc_config $name
          run_rc_command "$1"
          EOF
          chmod 555 "$ROOT/etc/rc.d/bsdkrun_agent"
          echo 'bsdkrun_agent=YES' >> "$ROOT/etc/rc.conf"

          # Bake in tailscale: copy the two static Go binaries the build VM's pkgin
          # fetched (exact-arch match; they link only base libc/ld.elf_so, so no
          # pkgsrc runtime deps land in the rootfs) + an rc.d service. Enabled in
          # rc.conf above (userspace-networking mode).
          mkdir -p "$ROOT/usr/pkg/bin"
          install -m 755 /usr/pkg/bin/tailscale  "$ROOT/usr/pkg/bin/tailscale"
          install -m 755 /usr/pkg/bin/tailscaled "$ROOT/usr/pkg/bin/tailscaled"
          cat > "$ROOT/etc/rc.d/tailscaled" <<'EOF'
          #!/bin/sh
          #
          # PROVIDE: tailscaled
          # REQUIRE: NETWORKING
          #
          # tailscaled=YES
          # tailscaled_flags="--tun=userspace-networking"

          . /etc/rc.subr

          name="tailscaled"
          rcvar=$name
          command="/usr/pkg/bin/tailscaled"
          pidfile="/var/run/tailscale/${name}.pid"
          tailscaled_socket="/var/run/tailscale/${name}.sock"

          start_precmd="tailscaled_precmd"
          start_cmd="tailscaled_start"
          stop_cmd="tailscaled_stop"

          tailscaled_precmd()
          {
          	[ -d /var/run/tailscale ] || /bin/mkdir -p /var/run/tailscale
          	[ -e "${tailscaled_socket}" ] && /bin/rm -f "${tailscaled_socket}"
          	return 0
          }

          tailscaled_start()
          {
          	echo "Starting ${name}."
          	${command} ${tailscaled_flags} &
          	echo $! > ${pidfile}
          }

          tailscaled_stop()
          {
          	if [ -f ${pidfile} ]; then
          		kill "$(cat ${pidfile})" 2>/dev/null && rm -f ${pidfile}
          	fi
          }

          load_rc_config $name
          run_rc_command "$1"
          EOF
          chmod 555 "$ROOT/etc/rc.d/tailscaled"

          # Build a generously sized FFS image (little-endian, FFSv2). The
          # amd64 bare image has no boot-time partition-resize hook, so growing
          # the backing file later does not make the guest root filesystem larger.
          # Keep enough room for source trees and build artifacts in bsdkrun guests.
          makefs -t ffs -B le -s 4g -o version=2,bsize=16384,fsize=2048,density=2048 \
            "$WORK/netbsd-amd64-root.img" "$ROOT"
          gzip -9 -c "$WORK/netbsd-amd64-root.img" > "$WS/dist/netbsd-amd64-root.img.gz"
          cp "$WORK/netbsd-MICROVM.gz" "$WS/dist/netbsd-MICROVM-amd64.gz"
          chmod 644 "$WS/dist"/*.gz
          ROOTEOF
          ls -lh "$WS/dist"

      - name: Checksums
        run: |
          set -eux
          cd dist
          for f in *.gz; do sha256sum "$f" > "$f.sha256"; done
          ls -lh

      - name: Publish to the rolling release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eux
          # Create the release once, then clobber its assets on every rebuild.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "NetBSD amd64 (prebuilt rootfs + MICROVM kernel)" \
              --notes "FFS rootfs built from the NetBSD-current amd64 sets with makefs, plus the matching MICROVM kernel (PVH). Rebuilt by the release-netbsd-amd64-image workflow. bsdkrun downloads these for \`bsdkrun netbsd\` on amd64 hosts."
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
