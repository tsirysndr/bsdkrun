[package]
name = "bsdkrun"
version = "0.5.2"
edition = "2021"
description = "A Firecracker-style microVM launcher for BSD and Linux (OCI) guests on macOS, built on libkrun (Hypervisor.framework)"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "time"] }
actix-web = "4"
rust-embed = "8"
mime_guess = "2"
