# `default-members` keeps `cargo build --release` meaning what it always has —
# just the CLI. The daemon is still built on demand (`cargo build -p
# bsdkrun-daemon`), so the CLI's release flow never pays for tonic, axum and a
# GraphQL engine; being workspace members only buys them a shared lockfile and
# one `target/` dir, which matters now that they share `bsdkrun-core`.
#
# `agent/` stays out: it is cross-compiled for the guest, not the host.
[workspace]
# The root package is a member implicitly. Listing it as `"."` as well makes
# cargo stop honouring `exclude` for nested manifests, which quietly adopts the
# Tauri app and the examples below.
members = ["core", "daemon"]
default-members = ["."]
# Everything else in the tree that carries a Cargo.toml but is built on its own
# terms: the guest agent (cross-compiled), the Tauri app, and the unikraft
# examples with their vendored sources.
exclude = ["agent", "desktop", "examples", "library"]

[package]
name = "bsdkrun"
version = "0.6.0"
edition = "2021"
description = "A Firecracker-style microVM launcher for BSD and Linux (OCI) guests on macOS, built on libkrun (Hypervisor.framework)"

[dependencies]
# The engine. This crate is the command-line front end over it and nothing more.
bsdkrun-core = { path = "core", features = ["ui"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
