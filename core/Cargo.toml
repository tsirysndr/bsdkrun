[package]
name = "bsdkrun-core"
version = "0.8.2"
edition = "2021"
description = "The bsdkrun engine: microVM boot, images, networking, volumes and the guest agent, as a library"

# Everything that actually drives a machine lives here so both front ends — the
# `bsdkrun` CLI and `bsdkrund` — call the same code. The daemon used to shell out
# to the CLI and rebuild its command lines as strings; linking this instead means
# the two can no longer drift, and a daemon needs no `bsdkrun` binary on PATH.
#
# `links` claims libkrun for the whole build graph, and lets `build.rs` publish
# the library directory to dependents as `DEP_KRUN_LIBDIR` — see build.rs for why
# the binary crates need it. With `boot` off, build.rs emits nothing and there is
# no libkrun in the link at all.
links = "krun"

[features]
default = ["boot"]
# Actually starting machines: the libkrun FFI and every boot path over it.
#
# Off, this crate links no hypervisor and builds anywhere — which is what lets
# `bsdkrund` stay a static, dependency-free binary while still being bsdkrun
# rather than a wrapper around it. It keeps the whole read and management
# surface (`api`, `ps`, `commit`, volumes, networks, flavors) and the command
# definitions it needs to *describe* a boot; `bsdkrun-supervisor` is the crate
# that turns one into a running machine.
boot = []
# `bsdkrun ui` — the embedded web SPA. Off by default so a consumer that only
# wants the engine (the daemon) does not pull in a web server.
ui = ["dep:actix-web", "dep:rust-embed", "dep:mime_guess"]
# `bsdkrun pack` — detect/plan/build a project into a Unikraft rootfs +
# Kraftfile with BuildKit. The actual tool is a Go binary (`pack/`) compiled by
# build.rs and embedded here with rust-embed; off by default for the same
# reason as `ui`.
pack = ["dep:rust-embed"]
# `bsdkrun solo5` — run a Solo5 unikernel (MirageOS and friends). The tender
# is a C program built from the pinned `library/solo5` submodule by build.rs
# and embedded here with rust-embed, exactly like pack's Go binary. Off by
# default for the same reason: it needs a C toolchain on the build host, and
# the daemon has no use for it.
solo5 = ["dep:rust-embed"]
# `bsdkrun tui` — the ratatui terminal dashboard. Off by default so the daemon
# links no terminal stack; only the CLI turns it on.
tui = ["dep:ratatui", "dep:crossterm", "dep:nucleo-matcher"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "time"] }
# `bsdkrun cache` archives. Linked rather than shelled out to: `zstd` is not on
# a stock macOS or a minimal Linux, and estargz cannot be produced by any CLI —
# it needs one gzip member per tar entry, which no gzip(1) exposes.
flate2 = "1"
zstd = "0.13"
tar = "0.4"
# SigV4 for the S3 cache backend. Pure Rust and no async runtime, so the
# "all HTTP goes through curl" rule in oci.rs still holds — we sign, curl sends.
sha2 = "0.10"
hmac = "0.12"
# estargz stages the incoming tar so it can find entry boundaries; a temp file
# rather than memory keeps a multi-gigabyte cache off the heap.
tempfile = "3"
actix-web = { version = "4", optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
nucleo-matcher = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
