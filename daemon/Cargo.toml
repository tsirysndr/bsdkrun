[package]
name = "bsdkrun-daemon"
version = "0.1.0"
edition = "2021"
description = "Token-authenticated gRPC daemon that drives the bsdkrun CLI (for remote VPS / bare-metal KVM hosts)"

# A workspace member, but not a `default-members` one: built on demand
# (`cargo build -p bsdkrun-daemon`) so the CLI's release flow keeps its small
# dependency tree, while both crates share one lockfile and one `target/` dir.

# The generated client is exported as a library so the CLI and the desktop app
# can link it and talk to a remote daemon instead of forking a local CLI.
[lib]
name = "bsdkrun_daemon"
path = "src/lib.rs"

[[bin]]
name = "bsdkrund"
path = "src/main.rs"
required-features = ["server"]

[features]
# Everything: the gRPC + GraphQL servers and the CLI driver behind them.
default = ["server"]
# The server half. Off, only the generated types and the gRPC client are built
# — which is all a *consumer* like the desktop app needs, and saves it pulling
# in a web server, a GraphQL engine and a pty implementation it will never use.
server = [
    "dep:bsdkrun-core",
    "dep:async-graphql",
    "dep:async-graphql-axum",
    "dep:async-stream",
    "dep:axum",
    "dep:base64",
    "dep:clap",
    "dep:portable-pty",
    "dep:sysinfo",
    "dep:tonic-health",
    "dep:tonic-reflection",
    "dep:tower-http",
    "dep:tracing-subscriber",
]

[build-dependencies]
tonic-prost-build = "0.14"

[dependencies]
# The engine. Optional so the desktop app, which builds this crate with
# `default-features = false` for its client half alone, never links libkrun.
bsdkrun-core = { path = "../core", optional = true }
tonic = { version = "0.14", features = ["router", "transport", "tls-ring", "tls-native-roots", "gzip"] }
tonic-prost = "0.14"
tonic-health = { version = "0.14", optional = true }
tonic-reflection = { version = "0.14", optional = true }
prost = "0.14"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "sync",
    "time",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["net"] }
# Interactive Exec/Attach needs a real pty on the daemon host, the same way the
# desktop app drives `bsdkrun shell` locally.
portable-pty = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
async-graphql = { version = "7", optional = true }
async-graphql-axum = { version = "7", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
base64 = { version = "0.22", optional = true }
async-stream = { version = "0.3", optional = true }
sysinfo = { version = "0.33", optional = true }

[dev-dependencies]
tempfile = "3"
tower = "0.5"

# No `[profile.release]` here: cargo only honours profiles from the workspace
# root, and the root deliberately leaves the defaults alone so the CLI's release
# binary is unchanged by this crate joining the workspace.
