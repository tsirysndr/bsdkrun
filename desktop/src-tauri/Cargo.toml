[package]
name = "bsdkrun-desktop"
version = "0.1.0"
description = "A Docker Desktop-style GUI for bsdkrun"
authors = ["Tsiry Sandratraina"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bsdkrun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
which = "6"
thiserror = "1"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "io-util", "time"] }
sysinfo = "0.33"

[features]
# By default Tauri runs in production mode; a custom-protocol build is used by
# the bundler. This mirrors the tauri template.
custom-protocol = ["tauri/custom-protocol"]
