# Listen on all interfaces: the host reaches Redis through bsdkrun's forwarded
# port, so binding to loopback would make the guest unreachable.
bind 0.0.0.0
port 6379

# There is no client outside the VM boundary to authenticate, and no other
# tenant inside it — this is a single-application unikernel.
protected-mode no

# No background saves. OSv has no fork(), which is how Redis normally snapshots;
# leaving this on would make BGSAVE fail at runtime rather than at startup.
save ""
