# Apache trimmed to a single-process, single-worker server for one static
# index.html. Compare ../unikraft-redis/redis.conf and
# ../unikraft-php/php.ini -- same idea, minimal directives, everything else
# left at compiled-in defaults.
ServerRoot "/etc/apache2"
PidFile /var/run/apache2/apache2.pid

# posixsem (APR's own default on Linux) needs a named semaphore; pthread
# mutexes are plain futexes, which is all a single-process server needs and
# what this repo's kconfig already provides (CONFIG_LIBPOSIX_FUTEX).
Mutex pthread default

ServerName localhost
ServerTokens Prod
Listen 8080

# Only what a static file server needs. mod_unixd and mod_log_config are
# compiled into the core binary already (see `apache2 -l`) and cannot be
# (re)loaded here; everything else Debian's package enables by default --
# cgi, userdir, status, autoindex, alias, auth, deflate, negotiation -- is
# left out.
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so

TypesConfig /etc/apache2/mime.types

DirectoryIndex index.html
DocumentRoot /var/www/html
<Directory /var/www/html>
    Require all granted
</Directory>

# No User/Group directive, deliberately. A unikernel has one user, uid 0 --
# see ../unikraft-postgres/README.md's allow-root.patch note -- and Debian's
# apache2 binary is compiled *without* -DBIG_SECURITY_HOLE, so `User root`
# fails config parsing outright ("Apache has not been designed to serve pages
# while running as root"), while `User www-data` parses fine but calls
# setuid(33) at startup, which this repo's libposix-user rejects with EINVAL
# (it implements exactly one fixed identity, CONFIG_LIBPOSIX_USER_UID). Unset
# entirely, unixd's configured uid stays -1: the "running as root" check
# never fires (it only triggers on an *explicit* uid/gid of 0) and no setuid
# is attempted, at the cost of one harmless startup line:
#   [unixd:alert] AH02155: getpwuid: couldn't determine user name from uid
#   4294967295, you probably need to modify the User directive

# /dev/stderr does not exist in this guest -- library/unikraft-base's devfs
# ships exactly one console device node, /dev/stdout (see
# lib/devfs/stdout.c: "One function for stderr and stdout"), and opening a
# path that is not there fails the way any missing file would. /dev/stdout is
# that same console node, wired to the PL011/serial console bsdkrun captures,
# so it is the only log target that actually reaches `bsdkrun logs`.
ErrorLog "/dev/stdout"
LogLevel warn
