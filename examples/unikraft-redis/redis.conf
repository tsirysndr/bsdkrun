bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no

# Every client reaches this server through bsdkrun's forwarded port, and those
# connections arrive from the gvproxy gateway address, not from loopback. With
# no password set, protected mode would answer every one of them with -DENIED.
# The listener is still only reachable through ports the host explicitly
# forwards.
protected-mode no

# Persistence is off, twice over. BGSAVE and AOF rewrite both fork(), which
# Unikraft does not have -- a background save would kill the server, and the
# default configuration schedules one ("save 3600 1 300 100 60 10000"). And the
# working directory is a ramfs that does not survive a reboot, so a dump file
# would buy nothing anyway.
appendonly no
save ""
dir /data

# On arm64, redis probes for the Linux ARM64 copy-on-write bug (fixed in 4.14)
# by actually fork()ing -- and treats the probe itself failing as if the bug
# were present, exiting with "Failed to test the kernel for a bug that could
# lead to data corruption during background save". Unikraft has no fork, so
# the probe can never run; and the bug it guards against only matters during a
# background save, which the settings above make impossible. Ignored on
# x86_64.
ignore-warnings ARM64-COW-BUG
