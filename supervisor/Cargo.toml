[package]
name = "bsdkrun-supervisor"
version = "0.10.0"
edition = "2021"
description = "Runs one bsdkrun command in its own process, and hosts the machine it boots"

[[bin]]
name = "bsdkrun-supervisor"
path = "src/main.rs"

[dependencies]
# The engine, with `boot`: this binary exists precisely to be the thing that
# links libkrun, so that `bsdkrund` does not have to. `solo5` too — the daemon
# can *describe* a solo5 boot without the feature, but this is the process
# that has to carry the embedded tender to actually run one.
bsdkrun-core = { path = "../core", features = ["solo5", "ci"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
